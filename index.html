<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yıldız Ağı</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Raleway:wght@300;400;500;600&display=swap');

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body,#root{height:100%;margin:0;padding:0;overflow:hidden;}

  body{
    background:#030014;
    font-family:'Raleway',sans-serif;
    color:#e8d5ff;
  }

  /* Nebula background */
  .nebula-bg{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(100,0,180,0.35) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 90%, rgba(0,50,180,0.3) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 50% 50%, rgba(80,0,100,0.2) 0%, transparent 70%),
      radial-gradient(ellipse 100% 100% at 10% 80%, rgba(200,100,0,0.08) 0%, transparent 50%),
      #030014;
  }

  /* Starfield */
  .starfield{position:fixed;inset:0;z-index:1;pointer-events:none;}
  .bg-star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s);}
  @keyframes twinkle{0%,100%{opacity:var(--lo,.2);transform:scale(1);}50%{opacity:var(--hi,.8);transform:scale(1.3);}}

  /* Cinematic intro */
  .intro-overlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#030014;}
  .intro-svg{width:min(90vw,500px);height:min(50vh,300px);}

  @keyframes starAppear{0%{opacity:0;transform:scale(0);}60%{transform:scale(1.4);}100%{opacity:1;transform:scale(1);}}
  @keyframes fadeUp{0%{opacity:0;transform:translateY(20px);}100%{opacity:1;transform:translateY(0);}}
  @keyframes letterReveal{0%{opacity:0;transform:translateY(-10px) scale(0.8);}100%{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes lineGrow{0%{stroke-dashoffset:1000;}100%{stroke-dashoffset:0;}}
  @keyframes introFadeOut{0%{opacity:1;}100%{opacity:0;pointer-events:none;}}
  .intro-title span{display:inline-block;animation:letterReveal .35s ease forwards;opacity:0;}
  .intro-subtitle{animation:fadeUp .8s ease forwards;opacity:0;}
  .intro-exit{animation:introFadeOut .8s ease forwards;}

  /* Main layout */
  .screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;overflow:hidden;}

  /* Header */
  .hdr{
    flex-shrink:0;
    padding:.6rem 1rem;
    background:rgba(15,5,35,.85);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(180,100,255,.2);
    display:flex;align-items:center;justify-content:space-between;
  }
  .hdr-title{
    font-family:'Cinzel',serif;
    font-size:1.1rem;
    font-weight:700;
    background:linear-gradient(135deg,#ffd700,#c084fc,#ffd700);
    background-size:200%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:gradientShift 4s ease infinite;
  }
  @keyframes gradientShift{0%,100%{background-position:0%;}50%{background-position:100%;}}

  /* Progress dots */
  .prog-dots{display:flex;gap:.3rem;align-items:center;}
  .prog-dot{width:10px;height:10px;border-radius:50%;transition:all .4s;}
  .prog-dot.done{background:radial-gradient(#ffd700,#f59e0b);box-shadow:0 0 6px #ffd700;}
  .prog-dot.active{background:radial-gradient(#c084fc,#7c3aed);box-shadow:0 0 8px #c084fc;animation:pulse .8s ease infinite;}
  .prog-dot.pending{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}

  /* Constellation area */
  .const-area{flex:1;position:relative;overflow:hidden;}
  .const-svg{width:100%;height:100%;}

  /* Star nodes */
  .star-node{cursor:pointer;transition:filter .3s;}
  .star-node:hover .star-outer{opacity:.8;}
  .star-node.solved .star-outer{animation:starGlow 2s ease infinite;}
  @keyframes starGlow{0%,100%{filter:drop-shadow(0 0 6px #ffd700);}50%{filter:drop-shadow(0 0 14px #ffd700) drop-shadow(0 0 28px #f59e0b);}}
  .star-node.active .star-outer{animation:activeGlow .6s ease infinite;}
  @keyframes activeGlow{0%,100%{filter:drop-shadow(0 0 8px #c084fc);}50%{filter:drop-shadow(0 0 20px #c084fc) drop-shadow(0 0 35px #7c3aed);}}

  /* Connection lines */
  .conn-line{stroke-dasharray:1000;stroke-dashoffset:1000;transition:stroke-dashoffset 1s ease;}
  .conn-line.drawn{stroke-dashoffset:0;}

  /* Input panel */
  .input-panel{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    transform:translateY(100%);
    transition:transform .4s cubic-bezier(.25,.8,.25,1);
    background:rgba(10,5,30,.97);
    backdrop-filter:blur(20px);
    border-top:1px solid rgba(180,100,255,.3);
    border-radius:20px 20px 0 0;
    padding:.8rem 1rem 1rem;
    max-height:70vh;
    overflow-y:auto;
    box-shadow:0 -20px 60px rgba(100,0,200,.25);
  }
  .input-panel.open{transform:translateY(0);}

  /* Star indicator */
  .star-indicator{
    text-align:center;
    font-size:.75rem;
    color:#c084fc;
    letter-spacing:.08em;
    font-weight:600;
    margin-bottom:.3rem;
  }
  .breadcrumb{
    display:flex;align-items:center;justify-content:center;
    gap:.4rem;font-size:.7rem;color:rgba(200,170,255,.6);
    margin-bottom:.6rem;
    flex-wrap:wrap;
  }
  .bc-word{
    padding:.15rem .4rem;border-radius:4px;
    background:rgba(255,255,255,.05);
    font-weight:600;letter-spacing:.05em;
  }
  .bc-word.known{color:#ffd700;background:rgba(255,215,0,.1);}
  .bc-word.unknown{color:rgba(200,170,255,.4);}
  .bc-arrow{color:rgba(180,130,255,.5);}

  /* Word display */
  .word-display{
    display:flex;justify-content:center;align-items:center;
    gap:.3rem;flex-wrap:wrap;
    min-height:2.8rem;margin-bottom:.5rem;
  }
  .letter-box{
    width:2.1rem;height:2.5rem;
    border:2px solid rgba(180,100,255,.4);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.1rem;font-weight:700;
    color:#e8d5ff;
    background:rgba(100,50,180,.15);
    transition:all .15s;
  }
  .letter-box.filled{
    border-color:rgba(192,132,252,.7);
    background:rgba(120,50,200,.25);
    box-shadow:0 0 8px rgba(192,132,252,.3);
  }

  /* Hint */
  .hint-area{
    text-align:center;font-size:.8rem;
    color:rgba(200,170,255,.8);
    min-height:1.6rem;margin-bottom:.5rem;
    line-height:1.4;padding:0 .5rem;
    font-style:italic;
  }

  /* Keyboard */
  .keyboard{display:flex;flex-direction:column;gap:.3rem;}
  .kb-row{display:flex;justify-content:center;gap:.25rem;}
  .kb-key{
    height:2.6rem;min-width:2.2rem;flex:1;max-width:2.8rem;
    border-radius:8px;border:none;cursor:pointer;
    font-size:.85rem;font-weight:700;
    background:rgba(80,40,140,.5);
    color:#e8d5ff;
    border:1px solid rgba(180,100,255,.25);
    transition:all .1s;
    display:flex;align-items:center;justify-content:center;
    font-family:'Raleway',sans-serif;
    user-select:none;
    -webkit-user-select:none;
  }
  .kb-key:active{transform:scale(.93);background:rgba(130,70,220,.6);}
  .kb-key.backspace{min-width:3.5rem;flex:1.5;font-size:.75rem;}
  .kb-key.submit{
    background:linear-gradient(135deg,rgba(180,130,0,.5),rgba(200,100,0,.4));
    border-color:rgba(255,200,50,.4);color:#ffd700;
    min-width:3.5rem;flex:1.5;
  }
  .kb-key.submit:active{background:linear-gradient(135deg,rgba(220,170,0,.7),rgba(240,130,0,.6));}
  .kb-key.hint-btn{
    background:rgba(40,80,160,.4);
    border-color:rgba(100,150,255,.3);
    color:#93c5fd;font-size:.7rem;
  }

  /* Toast */
  .toast{
    position:fixed;top:4.5rem;left:50%;transform:translateX(-50%) translateY(-80px);
    z-index:200;padding:.5rem 1.2rem;border-radius:20px;
    font-size:.85rem;font-weight:600;letter-spacing:.05em;
    transition:transform .3s ease, opacity .3s ease;
    opacity:0;white-space:nowrap;pointer-events:none;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
  .toast.error{background:rgba(180,20,20,.9);border:1px solid rgba(255,80,80,.4);color:#fca5a5;}
  .toast.success{background:rgba(20,120,60,.9);border:1px solid rgba(80,220,120,.4);color:#86efac;}
  .toast.info{background:rgba(40,40,140,.9);border:1px solid rgba(100,100,255,.4);color:#bfdbfe;}

  /* Win screen */
  .win-screen{
    position:fixed;inset:0;z-index:80;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse 100% 100% at 50% 50%, rgba(80,20,160,.95) 0%, rgba(3,0,20,.98) 70%);
    padding:2rem;
  }
  .win-title{
    font-family:'Cinzel',serif;font-size:2rem;font-weight:900;
    background:linear-gradient(135deg,#ffd700,#fff,#ffd700);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:fadeUp .8s ease .3s both;
  }
  .win-chain{display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:.4rem;margin:1.2rem 0;animation:fadeUp .8s ease .6s both;}
  .win-word{
    padding:.3rem .7rem;border-radius:8px;
    background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.4);
    color:#ffd700;font-weight:700;letter-spacing:.06em;
    font-size:.85rem;
  }
  .win-arrow{color:rgba(255,215,0,.5);font-size:.9rem;}
  .win-stats{display:flex;gap:1.5rem;margin:.8rem 0;animation:fadeUp .8s ease .9s both;}
  .win-stat{text-align:center;}
  .win-stat-val{font-size:1.8rem;font-weight:700;color:#ffd700;font-family:'Cinzel',serif;}
  .win-stat-lbl{font-size:.65rem;color:rgba(200,170,255,.7);letter-spacing:.08em;text-transform:uppercase;}

  /* Buttons */
  .btn-primary{
    padding:.7rem 2rem;border-radius:12px;border:none;cursor:pointer;
    background:linear-gradient(135deg,#7c3aed,#a855f7);
    color:#fff;font-family:'Raleway',sans-serif;font-size:.95rem;font-weight:700;
    letter-spacing:.05em;
    box-shadow:0 4px 20px rgba(124,58,237,.4);
    transition:all .2s;
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,58,237,.5);}
  .btn-primary:active{transform:translateY(0);}

  /* Home screen */
  .home-screen{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:1.5rem;gap:1rem;
  }
  .home-logo{
    font-family:'Cinzel',serif;font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#ffd700,#c084fc,#60a5fa,#ffd700);
    background-size:300%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:gradientShift 5s ease infinite;
    text-shadow:none;
    line-height:1.1;
    text-align:center;
  }
  .home-subtitle{color:rgba(200,170,255,.7);font-size:.85rem;letter-spacing:.15em;text-transform:uppercase;margin-top:-.4rem;}
  .level-card{
    width:100%;max-width:360px;
    background:rgba(20,10,50,.7);
    border:1px solid rgba(180,100,255,.25);
    border-radius:16px;
    padding:.8rem 1.2rem;
    display:flex;align-items:center;gap:.8rem;
    cursor:pointer;transition:all .2s;
  }
  .level-card:hover{border-color:rgba(192,132,252,.5);background:rgba(40,15,80,.7);transform:translateY(-2px);}
  .level-num{
    width:2.4rem;height:2.4rem;border-radius:50%;
    background:linear-gradient(135deg,#7c3aed,#a855f7);
    display:flex;align-items:center;justify-content:center;
    font-family:'Cinzel',serif;font-weight:700;color:#fff;
    flex-shrink:0;font-size:.85rem;
  }
  .level-info{flex:1;}
  .level-theme{font-size:.9rem;font-weight:600;color:#e8d5ff;}
  .level-cat{font-size:.68rem;color:rgba(192,132,252,.7);letter-spacing:.08em;text-transform:uppercase;}
  .level-stars{display:flex;gap:.2rem;}
  .level-star{font-size:.7rem;opacity:.3;}
  .level-star.lit{opacity:1;}

  /* Score */
  .score-badge{
    background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);
    border-radius:20px;padding:.2rem .7rem;
    font-size:.8rem;color:#ffd700;font-weight:700;
  }

  /* API key modal */
  .modal-overlay{
    position:fixed;inset:0;z-index:300;
    background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;
    padding:1rem;
  }
  .modal-box{
    background:rgba(15,8,40,.97);border:1px solid rgba(180,100,255,.3);
    border-radius:20px;padding:1.5rem;width:100%;max-width:380px;
  }
  .modal-title{font-family:'Cinzel',serif;font-size:1.1rem;color:#ffd700;margin-bottom:.5rem;}
  .modal-input{
    width:100%;padding:.6rem .8rem;border-radius:8px;border:1px solid rgba(180,100,255,.3);
    background:rgba(50,20,100,.3);color:#e8d5ff;font-size:.85rem;
    margin:.5rem 0;outline:none;font-family:'Raleway',sans-serif;
  }
  .modal-input:focus{border-color:rgba(192,132,252,.6);}

  /* Particle burst */
  @keyframes particleFly{
    0%{transform:translate(0,0) scale(1);opacity:1;}
    100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0;}
  }
  .particle{
    position:absolute;width:6px;height:6px;border-radius:50%;
    background:radial-gradient(#ffd700,#f59e0b);
    animation:particleFly .8s ease-out forwards;
    pointer-events:none;
  }

  /* Auth screen */
  .auth-screen{
    position:fixed;inset:0;z-index:25;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:2rem;gap:1rem;
  }
  .auth-input{
    width:100%;max-width:320px;padding:.7rem 1rem;
    border-radius:10px;border:1px solid rgba(180,100,255,.3);
    background:rgba(30,15,60,.5);color:#e8d5ff;
    font-size:.9rem;outline:none;font-family:'Raleway',sans-serif;text-align:center;
    letter-spacing:.1em;
  }
  .auth-input:focus{border-color:rgba(192,132,252,.6);}

  /* Scrollbar */
  ::-webkit-scrollbar{width:4px;}
  ::-webkit-scrollbar-track{background:rgba(255,255,255,.02);}
  ::-webkit-scrollbar-thumb{background:rgba(192,132,252,.3);border-radius:2px;}

  /* Responsive */
  @media(max-height:600px){
    .input-panel{padding:.5rem .8rem .7rem;}
    .kb-key{height:2.2rem;}
    .letter-box{width:1.9rem;height:2.2rem;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

// ─── Constants ───────────────────────────────────────────────────────────────
const MODEL="claude-sonnet-4-20250514";
const MAXL=100, DI=15, DL=3, DW=1, DC=1, SI=3;

// ─── LocalStorage helpers ─────────────────────────────────────────────────────
const LS={
  g:(k,d)=>{try{const v=localStorage.getItem('ya4_'+k);return v!=null?JSON.parse(v):d;}catch{return d;}},
  s:(k,v)=>{try{localStorage.setItem('ya4_'+k,JSON.stringify(v));}catch{}}
};

// ─── Audio Engine ─────────────────────────────────────────────────────────────
let _ctx=null;
const AC=()=>{if(!_ctx)try{_ctx=new(window.AudioContext||window.webkitAudioContext)();}catch{}return _ctx;};
const SFX={
  note:(f,t,d=.12,type='sine',vol=.18)=>{
    const c=AC();if(!c)return;
    const o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.frequency.value=f;o.type=type;
    g.gain.setValueAtTime(0,c.currentTime);
    g.gain.linearRampToValueAtTime(vol,c.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t);
    o.start(c.currentTime);o.stop(c.currentTime+t+.02);
  },
  key:()=>SFX.note(880,.08,'sine',.12),
  error:()=>{SFX.note(220,.3,'sawtooth',.07);setTimeout(()=>SFX.note(180,.3,'sawtooth',.07),120);},
  win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>SFX.note(f,.5,'sine',.2),i*150));},
  click:()=>SFX.note(660,.06,'sine',.1),
  hint:()=>{SFX.note(440,.2,'sine',.08);setTimeout(()=>SFX.note(550,.3,'sine',.08),200);},
  star:()=>{[880,1100,1320,1760].forEach((f,i)=>setTimeout(()=>SFX.note(f,.3,'sine',.15),i*80));}
};

// Ambient music engine
const MUS={
  notes:[196,220,261,329,392,440,523],
  playing:false,timer:null,
  start(){
    if(this.playing)return;this.playing=true;
    const play=()=>{
      if(!this.playing)return;
      const f=this.notes[Math.floor(Math.random()*this.notes.length)];
      SFX.note(f,1.5,'sine',.06);
      this.timer=setTimeout(play,800+Math.random()*1200);
    };
    this.timer=setTimeout(play,1000);
  },
  stop(){this.playing=false;clearTimeout(this.timer);}
};

// ─── Levels ───────────────────────────────────────────────────────────────────
const LEVELS=[
  {id:1,theme:"Görünmez Bağ",category:"Doğa",chain:["İPEK","BÖCEK","ÇİÇEK","BAL","PETEK"],
   hints:["Yumuşacık dokunuşlu değerli kumaş","İpeği üreten küçük yaratık","Böceğin ziyaret ettiği renkli güzellik","Çiçekten toplanan tatlı hazine","Balın saklandığı altıgen yapı"]},
  {id:2,theme:"Büyümenin Sırrı",category:"Doğa",chain:["TOHUM","TOPRAK","KÖK","AĞAÇ","ORMAN"],
   hints:["Yaşamın en küçük başlangıcı","Tohumun uyuduğu kadim yatak","Toprağın derinliklerine uzanan","Köklerin büyüttüğü uzun ömürlü","Ağaçların bir araya geldiği sığınak"]},
  {id:3,theme:"Sessiz Av",category:"Yaşam",chain:["DAMLA","GÖL","BALIK","OLTA","SABIR"],
   hints:["Suyun en küçük formu","Damlaların birleşip durgunlaştığı","Gölün sessiz sakinleri","Balıkçının uzatan eli","En değerli erdemi öğreten bekleme"]},
  {id:4,theme:"Zıtların Dansı",category:"Fizik",chain:["GÖLGE","IŞIK","CAM","KIRIŞ","GÖKKUŞAĞI"],
   hints:["Karanlığın bedene yapışanı","Gölgeyi yok eden güç","Işığın geçebildiği saydam madde","Camdan geçen ışık demeti","Kırışın gökyüzündeki renk cümbüşü"]},
  {id:5,theme:"Düzenin Paradoksu",category:"Felsefe",chain:["ÇOCUK","OYUN","KURAL","YASA","ÖZGÜRLÜK"],
   hints:["Masumiyetin en saf hali","Çocuğun dünyayı keşfetme yolu","Oyunu düzenleyen gizli anlaşma","Kuralların toplumsal karşılığı","Yasaların korumaya çalıştığı değer"]},
  {id:6,theme:"Zihnin Labirenti",category:"Felsefe",chain:["AYNA","YANSIMA","HAFIZA","RÜYA","GERÇEK","MASKE"],
   hints:["Kendini gördüğün yüzey","Aynanın sana geri verdiği","Yansımaların biriktiği depo","Hafızanın uykuda oynadığı oyun","Rüyadan uyanınca döndüğün","Gerçeği gizlemek için takılan"]},
  {id:7,theme:"Yağmurun Hediyesi",category:"Doğa",chain:["BULUT","YAĞMUR","TOPRAK","TOHUM","ÇİÇEK","RENK"],
   hints:["Gökyüzünün yüzen adaları","Bulutun yere dokunuşu","Yağmurun işlediği kanvas","Toprağın koruduğu umut","Tohumun güneşe uzanışı","Çiçeğin dünyaya kattığı"]},
  {id:8,theme:"Sessiz Dil",category:"Sanat",chain:["GÖZYAŞI","TUZ","DENİZ","MERCAN","RENK","TABLO"],
   hints:["Duygunun sıvı hali","Gözyaşının bıraktığı kristal","Tuzun evine dönüşü","Denizin canlı mimarisi","Mercanın doğaya kattığı","Renklerin tuval üzerinde buluşması"]},

// ─── Star positions (relative 0–100) ─────────────────────────────────────────
function getStarPositions(n){
  // Generate beautiful constellation-like positions for n stars
  const configs={
    5:[[20,75],[35,35],[50,65],[65,30],[80,70]],
    6:[[15,70],[30,30],[50,55],[55,20],[70,60],[85,35]],
    7:[[12,75],[28,40],[42,70],[50,20],[62,50],[75,75],[88,35]],
  };
  if(configs[n]) return configs[n];
  // Fallback: arc
  return Array.from({length:n},(_,i)=>{
    const t=i/(n-1);
    return [15+70*t, 50+20*Math.sin(Math.PI*t)];
  });
}

// ─── AI helper ────────────────────────────────────────────────────────────────
async function callAI(word,chain,idx,hint){
  const key=LS.g('apiKey','');
  if(!key) return null;
  const prevWord=idx>0?chain[idx-1]:'(başlangıç)';
  const nextWord=idx<chain.length-1?chain[idx+1]:'(son)';
  const prompt=`Türkçe kelime bulmaca oyunu. Zincir: ${chain.join(' → ')}\nBu yıldız ${idx+1}. kelimeyi soruyor.\nÖnceki kelime: "${prevWord}", Sonraki: "${nextWord}"\nİpucu: "${hint}"\nTek cümle, 15 kelimeden az, sadece ipucu (kelimeyi söyleme):`;
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-api-key":key,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body:JSON.stringify({model:MODEL,max_tokens:80,messages:[{role:"user",content:prompt}]})
    });
    const d=await r.json();
    return d.content?.[0]?.text||null;
  }catch{return null;}
}

// ─── Constellation SVG ────────────────────────────────────────────────────────
function ConstellationView({level,solved,activeIdx,particles,onStarClick,containerRef}){
  const n=level.chain.length;
  const rawPos=getStarPositions(n);

  // We'll render inside a relative div; positions are in %
  return(
    <div ref={containerRef} className="const-area" style={{position:'relative'}}>
      <svg className="const-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"
        style={{position:'absolute',inset:0,width:'100%',height:'100%',overflow:'visible'}}>
        <defs>
          <radialGradient id="starGrad">
            <stop offset="0%" stopColor="#fff"/>
            <stop offset="30%" stopColor="#ffd700"/>
            <stop offset="100%" stopColor="#f59e0b" stopOpacity="0"/>
          </radialGradient>
          <radialGradient id="starGradSolved">
            <stop offset="0%" stopColor="#fff"/>
            <stop offset="25%" stopColor="#ffd700"/>
            <stop offset="70%" stopColor="#f59e0b"/>
            <stop offset="100%" stopColor="#f59e0b" stopOpacity="0"/>
          </radialGradient>
          <radialGradient id="starGradActive">
            <stop offset="0%" stopColor="#fff"/>
            <stop offset="30%" stopColor="#c084fc"/>
            <stop offset="100%" stopColor="#7c3aed" stopOpacity="0"/>
          </radialGradient>
          <radialGradient id="starGradPending">
            <stop offset="0%" stopColor="rgba(180,130,255,.8)"/>
            <stop offset="100%" stopColor="rgba(100,50,200,0)"/>
          </radialGradient>
          <linearGradient id="lineGradSolved" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stopColor="#ffd700" stopOpacity=".9"/>
            <stop offset="50%" stopColor="#fff" stopOpacity=".6"/>
            <stop offset="100%" stopColor="#ffd700" stopOpacity=".9"/>
          </linearGradient>
          <filter id="glow1"><feGaussianBlur stdDeviation=".8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="glow2"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="glow3"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        {/* Connection lines */}
        {rawPos.map((p,i)=>{
          if(i>=n-1)return null;
          const p2=rawPos[i+1];
          const bothSolved=solved[i]&&solved[i+1];
          const oneSolved=solved[i]&&!solved[i+1];
          return(
            <g key={`line-${i}`}>
              {/* Base dim line */}
              <line
                x1={p[0]} y1={p[1]} x2={p2[0]} y2={p2[1]}
                stroke="rgba(180,100,255,.15)" strokeWidth=".4"
              />
              {/* Animated line when solved */}
              {(bothSolved||oneSolved) && (
                <line
                  x1={p[0]} y1={p[1]} x2={p2[0]} y2={p2[1]}
                  stroke={bothSolved?"url(#lineGradSolved)":"rgba(255,215,0,.5)"}
                  strokeWidth={bothSolved?"1":"0.6"}
                  strokeDasharray="100"
                  className="conn-line drawn"
                  style={{filter:bothSolved?'drop-shadow(0 0 1px #ffd700)':'none'}}
                />
              )}
            </g>
          );
        })}

        {/* Stars */}
        {rawPos.map((p,i)=>{
          const isSolved=solved[i];
          const isActive=i===activeIdx;
          const isNext=!isSolved&&solved[i-1]!==false&&(i===0||(i>0&&solved[i-1]));
          const isLocked=!isSolved&&!isActive&&!isNext;
          return(
            <g key={`star-${i}`}
              className={`star-node${isSolved?' solved':''}${isActive?' active':''}`}
              onClick={()=>onStarClick(i)}
              style={{cursor:isLocked?'default':'pointer'}}
            >
              {/* Outer glow */}
              <circle cx={p[0]} cy={p[1]} r={isSolved?3.5:isActive?3:2.2}
                fill={isSolved?"url(#starGradSolved)":isActive?"url(#starGradActive)":"url(#starGradPending)"}
                opacity={isSolved?.9:isActive?.8:.4}
                filter={isSolved?"url(#glow3)":isActive?"url(#glow2)":"url(#glow1)"}
              />
              {/* Core */}
              <circle cx={p[0]} cy={p[1]} r={isSolved?1.5:isActive?1.2:.8}
                fill={isSolved?"#fff":isActive?"#e8d5ff":"rgba(180,130,255,.6)"}
                filter="url(#glow1)"
              />
              {/* Star number badge */}
              <circle cx={p[0]+2.2} cy={p[1]-2.2} r="1.8"
                fill={isSolved?"rgba(255,200,0,.9)":isActive?"rgba(180,80,255,.9)":"rgba(40,20,80,.8)"}
                stroke={isSolved?"#ffd700":isActive?"#c084fc":"rgba(180,100,255,.4)"}
                strokeWidth=".3"
              />
              <text x={p[0]+2.2} y={p[1]-2.2}
                textAnchor="middle" dominantBaseline="central"
                fontSize="1.6" fontWeight="bold"
                fill={isSolved?"#1a0a00":isActive?"#fff":"rgba(180,130,255,.8)"}
                style={{fontFamily:"sans-serif",userSelect:'none'}}
              >{i+1}</text>

              {/* Word label */}
              {isSolved && (
                <text x={p[0]} y={p[1]+4.5}
                  textAnchor="middle" fontSize="1.8" fontWeight="bold"
                  fill="#ffd700" opacity=".9"
                  style={{fontFamily:"'Cinzel',serif",userSelect:'none',
                    filter:'drop-shadow(0 0 1px rgba(0,0,0,.8))'}}
                >{level.chain[i]}</text>
              )}
              {!isSolved && (
                <text x={p[0]} y={p[1]+4.5}
                  textAnchor="middle" fontSize="1.6"
                  fill={isActive?"rgba(192,132,252,.9)":"rgba(150,100,200,.5)"}
                  style={{fontFamily:"sans-serif",userSelect:'none'}}
                >{"?".repeat(Math.min(level.chain[i].length,5))}</text>
              )}
            </g>
          );
        })}
      </svg>

      {/* HTML particles layer */}
      {particles.map(p=>(
        <div key={p.id} className="particle" style={{
          left:p.x,top:p.y,
          '--tx':p.tx,'--ty':p.ty,
          background:`radial-gradient(${p.color},transparent)`,
          width:p.size+'px',height:p.size+'px'
        }}/>
      ))}
    </div>
  );
}

// ─── Play Screen ──────────────────────────────────────────────────────────────
function PlayScreen({level,score,setScore,onWin,onBack}){
  const n=level.chain.length;
  const [solved,setSolved]=useState(()=>Array(n).fill(false));
  const [activeIdx,setActiveIdx]=useState(null);
  const [input,setInput]=useState('');
  const [hint,setHint]=useState('');
  const [aiHint,setAiHint]=useState('');
  const [hintUsed,setHintUsed]=useState(0);
  const [panelOpen,setPanelOpen]=useState(false);
  const [toast,setToast]=useState({msg:'',type:'',show:false});
  const [particles,setParticles]=useState([]);
  const [mistakes,setMistakes]=useState(0);
  const [aiLoading,setAiLoading]=useState(false);
  const [showApiModal,setShowApiModal]=useState(false);
  const correctGuardRef=useRef(false);
  const toastTimer=useRef(null);
  const containerRef=useRef(null);
  const rawPos=getStarPositions(n);

  const showToast=(msg,type='info',dur=2000)=>{
    clearTimeout(toastTimer.current);
    setToast({msg,type,show:true});
    toastTimer.current=setTimeout(()=>setToast(t=>({...t,show:false})),dur);
  };

  const openStar=(idx)=>{
    // Can only open unsolved stars that are reachable
    if(solved[idx])return;
    const reachable=idx===0||(idx>0&&solved[idx-1]);
    if(!reachable){showToast('Önce önceki yıldızı çöz!','error');SFX.error();return;}
    SFX.click();
    setActiveIdx(idx);
    setInput('');
    setHint(level.hints[idx]||'');
    setAiHint('');
    setHintUsed(0);
    setPanelOpen(true);
    correctGuardRef.current=false;
  };

  const closePanel=()=>{
    setPanelOpen(false);
    setTimeout(()=>{setActiveIdx(null);setInput('');setHint('');setAiHint('');},400);
  };

  const pressKey=(ch)=>{
    if(activeIdx===null)return;
    const maxLen=level.chain[activeIdx].length+2;
    if(input.length>=maxLen)return;
    SFX.key();
    setInput(p=>p+ch);
  };

  const backspace=()=>{
    if(!input.length)return;
    SFX.key();
    setInput(p=>p.slice(0,-1));
  };

  const spawnParticles=(pct)=>{
    if(!containerRef.current)return;
    const rect=containerRef.current.getBoundingClientRect();
    const px=(rawPos[pct][0]/100)*rect.width;
    const py=(rawPos[pct][1]/100)*rect.height;
    const colors=['#ffd700','#fff','#f59e0b','#c084fc','#fb923c'];
    const newParticles=Array.from({length:8},(_,i)=>{
      const angle=(i/8)*Math.PI*2;
      const dist=40+Math.random()*30;
      return{
        id:Date.now()+i,
        x:px+'px',y:py+'px',
        tx:(Math.cos(angle)*dist)+'px',
        ty:(Math.sin(angle)*dist)+'px',
        color:colors[i%colors.length],
        size:4+Math.random()*4
      };
    });
    setParticles(p=>[...p,...newParticles]);
    setTimeout(()=>setParticles(p=>p.filter(x=>!newParticles.find(n=>n.id===x.id))),900);
  };

  const submit=()=>{
    if(activeIdx===null||!input.trim())return;
    if(correctGuardRef.current)return;
    const guess=input.trim().toUpperCase();
    const answer=level.chain[activeIdx];
    if(guess===answer){
      correctGuardRef.current=true;
      SFX.star();
      spawnParticles(activeIdx);
      const pts=Math.max(DW, DW + (DI - hintUsed*DL) - mistakes*DC);
      setScore(s=>s+pts);
      setSolved(prev=>{
        const nx=[...prev];nx[activeIdx]=true;return nx;
      });
      showToast('Doğru! +'+pts+' puan','success');
      setPanelOpen(false);
      setTimeout(()=>{
        setActiveIdx(null);setInput('');setHint('');setAiHint('');
        correctGuardRef.current=false;
      },400);
    }else{
      SFX.error();
      setMistakes(m=>m+1);
      showToast('Yanlış, tekrar dene...','error');
      setInput('');
    }
  };

  // Check win
  useEffect(()=>{
    if(solved.every(Boolean)){
      setTimeout(()=>onWin(score,solved),700);
    }
  },[solved]);

  const requestHint=async()=>{
    if(activeIdx===null)return;
    const key=LS.g('apiKey','');
    if(!key){setShowApiModal(true);return;}
    SFX.hint();
    setAiLoading(true);
    setHintUsed(h=>h+1);
    const text=await callAI(level.chain[activeIdx],level.chain,activeIdx,level.hints[activeIdx]);
    setAiLoading(false);
    if(text)setAiHint(text);
    else showToast('AI ipucu alınamadı','error');
  };

  // Breadcrumb
  const breadcrumb=()=>{
    if(activeIdx===null)return null;
    const prev=activeIdx>0?(solved[activeIdx-1]?level.chain[activeIdx-1]:'???'):null;
    const next=activeIdx<n-1?(solved[activeIdx+1]?level.chain[activeIdx+1]:'???'):null;
    return(
      <div className="breadcrumb">
        {prev&&<><span className={`bc-word ${solved[activeIdx-1]?'known':'unknown'}`}>{prev}</span><span className="bc-arrow">→</span></>}
        <span className="bc-word" style={{color:'#c084fc',background:'rgba(192,132,252,.15)',border:'1px solid rgba(192,132,252,.3)'}}>???</span>
        {next&&<><span className="bc-arrow">→</span><span className={`bc-word ${solved[activeIdx+1]?'known':'unknown'}`}>{next}</span></>}
      </div>
    );
  };

  const progressDots=()=>(
    <div className="prog-dots">
      {solved.map((s,i)=>(
        <div key={i} className={`prog-dot ${s?'done':i===activeIdx?'active':'pending'}`}/>
      ))}
    </div>
  );

  return(
    <div className="screen">
      {/* Header */}
      <div className="hdr">
        <button onClick={()=>{SFX.click();onBack();}} style={{
          background:'none',border:'none',color:'rgba(200,170,255,.7)',
          cursor:'pointer',fontSize:'.85rem',padding:'.2rem .4rem',
          fontFamily:"'Raleway',sans-serif",letterSpacing:'.05em'
        }}>← Geri</button>
        <div style={{textAlign:'center'}}>
          <div className="hdr-title" style={{fontSize:'.9rem'}}>{level.theme}</div>
          <div style={{fontSize:'.65rem',color:'rgba(192,132,252,.6)',letterSpacing:'.1em'}}>{level.category}</div>
        </div>
        <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:'.2rem'}}>
          <div className="score-badge">⭐ {score}</div>
          {progressDots()}
        </div>
      </div>

      {/* Constellation */}
      <ConstellationView
        level={level} solved={solved} activeIdx={activeIdx}
        particles={particles} onStarClick={openStar} containerRef={containerRef}
      />

      {/* Input panel */}
      <div className={`input-panel${panelOpen?' open':''}`}>
        {activeIdx!==null && (
          <>
            <div className="star-indicator">⭐ {activeIdx+1}. Yıldız / {n}</div>
            {breadcrumb()}

            {/* Word display */}
            <div className="word-display">
              {Array.from({length:level.chain[activeIdx]?.length||0},(_,i)=>(
                <div key={i} className={`letter-box${i<input.length?' filled':''}`}>
                  {i<input.length?input[i]:''}
                </div>
              ))}
            </div>

            {/* Hint */}
            <div className="hint-area">
              {aiLoading?'Düşünüyor...':aiHint||hint||''}
            </div>

            {/* Keyboard */}
            <div className="keyboard">
              {KB.map((row,ri)=>(
                <div key={ri} className="kb-row">
                  {row.map(ch=>(
                    <button key={ch} className="kb-key" onPointerDown={e=>{e.preventDefault();pressKey(ch);}}>
                      {ch}
                    </button>
                  ))}
                  {ri===2&&(
                    <>
                      <button className="kb-key submit" onPointerDown={e=>{e.preventDefault();submit();}}>GİR</button>
                      <button className="kb-key backspace" onPointerDown={e=>{e.preventDefault();backspace();}}>⌫</button>
                    </>
                  )}
                </div>
              ))}
              {/* Bottom row */}
              <div className="kb-row" style={{marginTop:'.1rem',gap:'.4rem'}}>
                <button className="kb-key hint-btn" style={{flex:1,maxWidth:'none',height:'2.2rem'}}
                  onPointerDown={e=>{e.preventDefault();requestHint();}}>
                  {aiLoading?'⏳ Yükleniyor...':'🤖 AI İpucu'}
                </button>
                <button className="kb-key" style={{
                  flex:.6,maxWidth:'none',height:'2.2rem',fontSize:'.7rem',
                  background:'rgba(60,20,80,.4)',borderColor:'rgba(180,100,255,.2)',
                  color:'rgba(180,130,255,.7)'
                }}
                  onPointerDown={e=>{e.preventDefault();closePanel();}}>
                  Kapat
                </button>
              </div>
            </div>
          </>
        )}
      </div>

      {/* Toast */}
      <div className={`toast ${toast.type}${toast.show?' show':''}`}>{toast.msg}</div>

      {/* API key modal */}
      {showApiModal&&(
        <ApiKeyModal
          onSave={()=>setShowApiModal(false)}
          onClose={()=>setShowApiModal(false)}
        />
      )}
    </div>
  );
}

// ─── Win Screen ───────────────────────────────────────────────────────────────
function WinScreen({level,score,totalScore,onNext,onHome}){
  useEffect(()=>{SFX.win();MUS.stop();},[]);
  const n=level.chain.length;
  const rawPos=getStarPositions(n);
  return(
    <div className="win-screen">
      <BgStars/>
      <div style={{position:'relative',zIndex:2,display:'flex',flexDirection:'column',alignItems:'center',gap:'.8rem',width:'100%',maxWidth:400}}>
        <div style={{fontSize:'2.5rem',animation:'fadeUp .6s ease both'}}>🌟</div>
        <div className="win-title">Tebrikler!</div>
        <div style={{color:'rgba(200,170,255,.7)',fontSize:'.8rem',letterSpacing:'.1em',animation:'fadeUp .8s ease .4s both'}}>
          {level.theme} — {level.category}
        </div>

        {/* Mini constellation */}
        <svg viewBox="0 0 100 50" style={{width:'min(300px,80vw)',height:80,animation:'fadeUp .8s ease .5s both'}}>
          <defs>
            <radialGradient id="winStar">
              <stop offset="0%" stopColor="#fff"/>
              <stop offset="40%" stopColor="#ffd700"/>
              <stop offset="100%" stopColor="#f59e0b" stopOpacity="0"/>
            </radialGradient>
          </defs>
          {rawPos.map((p,i)=>{
            if(i>=n-1)return null;
            const p2=rawPos[i+1];
            const sx=p[0]/2, sy=p[1]/2, ex=p2[0]/2, ey=p2[1]/2;
            return<line key={i} x1={sx} y1={sy} x2={ex} y2={ey}
              stroke="url(#lineGradSolved)" strokeWidth=".8" opacity=".8"/>;
          })}
          {rawPos.map((p,i)=>(
            <g key={i}>
              <circle cx={p[0]/2} cy={p[1]/2} r="3" fill="url(#winStar)" opacity=".9"/>
              <circle cx={p[0]/2} cy={p[1]/2} r="1.2" fill="#fff"/>
            </g>
          ))}
        </svg>

        {/* Word chain */}
        <div className="win-chain">
          {level.chain.map((w,i)=>(
            <React.Fragment key={i}>
              {i>0&&<span className="win-arrow">→</span>}
              <span className="win-word">{w}</span>
            </React.Fragment>
          ))}
        </div>

        {/* Stats */}
        <div className="win-stats">
          <div className="win-stat"><div className="win-stat-val">{score}</div><div className="win-stat-lbl">Bu Bölüm</div></div>
          <div className="win-stat"><div className="win-stat-val">{totalScore}</div><div className="win-stat-lbl">Toplam</div></div>
          <div className="win-stat"><div className="win-stat-val">{n}</div><div className="win-stat-lbl">Yıldız</div></div>
        </div>

        <div style={{display:'flex',gap:'.8rem',flexWrap:'wrap',justifyContent:'center',animation:'fadeUp .8s ease 1.1s both'}}>
          <button className="btn-primary" onClick={onNext}>Devam Et →</button>
          <button onClick={onHome} style={{
            padding:'.7rem 1.5rem',borderRadius:12,border:'1px solid rgba(180,100,255,.3)',
            background:'transparent',color:'rgba(200,170,255,.7)',cursor:'pointer',
            fontFamily:"'Raleway',sans-serif",fontSize:'.9rem',fontWeight:600
          }}>Ana Menü</button>
        </div>
      </div>
    </div>
  );
}

// ─── Home Screen ──────────────────────────────────────────────────────────────
function HomeScreen({onPlay,totalScore,progress}){
  const [scroll,setScroll]=useState(false);
  useEffect(()=>{MUS.start();},[]);
  return(
    <div className="home-screen" style={{overflowY:'auto'}}>
      <div className="home-logo">Yıldız Ağı</div>
      <div className="home-subtitle">Söz Zinciri Bulmacası</div>

      <div className="score-badge" style={{fontSize:'.9rem'}}>⭐ Toplam: {totalScore}</div>

      <div style={{width:'100%',maxWidth:380,display:'flex',flexDirection:'column',gap:'.5rem',marginTop:'.5rem'}}>
        {LEVELS.map(lv=>{
          const done=progress[lv.id]||false;
          const unlocked=lv.id===1||(progress[lv.id-1]||false);
          return(
            <div key={lv.id} className="level-card"
              style={{opacity:unlocked?1:.5,cursor:unlocked?'pointer':'not-allowed'}}
              onClick={()=>{if(unlocked){SFX.click();onPlay(lv);}}}
            >
              <div className="level-num" style={{background:done?'linear-gradient(135deg,#d97706,#f59e0b)':undefined}}>
                {done?'✓':lv.id}
              </div>
              <div className="level-info">
                <div className="level-theme">{lv.theme}</div>
                <div className="level-cat">{lv.category} · {lv.chain.length} yıldız</div>
              </div>
              <div className="level-stars">
                {Array.from({length:Math.min(3,lv.chain.length)},(_,i)=>(
                  <span key={i} className={`level-star${done?' lit':''}`}>★</span>
                ))}
              </div>
            </div>
          );
        })}
      </div>
      <div style={{height:'1rem'}}/>
    </div>
  );
}

// ─── Auth Screen ──────────────────────────────────────────────────────────────
function AuthScreen({onAuth}){
  const [name,setName]=useState('');
  return(
    <div className="auth-screen">
      <div className="home-logo" style={{fontSize:'clamp(2rem,10vw,3.2rem)'}}>Yıldız Ağı</div>
      <div className="home-subtitle">Söz Zinciri Bulmacası</div>
      <div style={{color:'rgba(200,170,255,.6)',fontSize:'.8rem',maxWidth:300,textAlign:'center',lineHeight:1.6,marginTop:'.5rem'}}>
        Yıldızlar arasında gizli bir söz zinciri var. Her yıldızı doğru kelimeyle aydınlat!
      </div>
      <input className="auth-input" placeholder="Adını gir..." value={name}
        onChange={e=>setName(e.target.value)}
        onKeyDown={e=>{if(e.key==='Enter'&&name.trim()){SFX.click();onAuth(name.trim());}}}
      />
      <button className="btn-primary" style={{marginTop:'.3rem'}}
        onClick={()=>{if(name.trim()){SFX.click();onAuth(name.trim());}}}>
        Yıldızlara Yolculuk →
      </button>
    </div>
  );
}

// ─── Root App ─────────────────────────────────────────────────────────────────
function App(){
  const [phase,setPhase]=useState('intro'); // intro|auth|home|play|win
  const [userName,setUserName]=useState(()=>LS.g('userName',''));
  const [totalScore,setTotalScore]=useState(()=>LS.g('totalScore',0));
  const [progress,setProgress]=useState(()=>LS.g('progress',{}));
  const [currentLevel,setCurrentLevel]=useState(null);
  const [levelScore,setLevelScore]=useState(0);

  useEffect(()=>{
    if(userName) setPhase('intro');
    else setPhase('intro');
  },[]);

  const handleIntroDone=()=>{
    if(userName) setPhase('home');
    else setPhase('auth');
  };

  const handleAuth=(name)=>{
    LS.s('userName',name);
    setUserName(name);
    setPhase('home');
  };

  const handlePlay=(lv)=>{
    setCurrentLevel(lv);
    setLevelScore(0);
    setPhase('play');
  };

  const handleWin=(score)=>{
    const newTotal=totalScore+score;
    setTotalScore(newTotal);
    LS.s('totalScore',newTotal);
    const newProg={...progress,[currentLevel.id]:true};
    setProgress(newProg);
    LS.s('progress',newProg);
    setLevelScore(score);
    setPhase('win');
  };

  const handleNext=()=>{
    const nextIdx=LEVELS.findIndex(l=>l.id===currentLevel.id)+1;
    if(nextIdx<LEVELS.length){
      setCurrentLevel(LEVELS[nextIdx]);
      setLevelScore(0);
      setPhase('play');
    }else{
      setPhase('home');
    }
  };

  return(
    <>
      <div className="nebula-bg"/>
      <BgStars/>

      {phase==='intro'&&(
        <CinematicIntro onDone={handleIntroDone}/>
      )}

      {phase==='auth'&&(
        <AuthScreen onAuth={handleAuth}/>
      )}

      {phase==='home'&&(
        <HomeScreen
          onPlay={handlePlay}
          totalScore={totalScore}
          progress={progress}
        />
      )}

      {phase==='play'&&currentLevel&&(
        <PlayScreen
          key={currentLevel.id}
          level={currentLevel}
          score={levelScore}
          setScore={setLevelScore}
          onWin={handleWin}
          onBack={()=>setPhase('home')}
        />
      )}

      {phase==='win'&&currentLevel&&(
        <WinScreen
          level={currentLevel}
          score={levelScore}
          totalScore={totalScore}
          onNext={handleNext}
          onHome={()=>setPhase('home')}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
