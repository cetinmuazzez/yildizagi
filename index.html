// API
function callAI(prompt,mt){
  if(!mt)mt=600;
  return fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:MODEL,max_tokens:mt,messages:[{role:"user",content:prompt}]})}).then(function(r){if(!r.ok)throw new Error("API "+r.status);return r.json()}).then(function(d){var b=d.content&&d.content.find(function(x){return x.type==="text"});return(b&&b.text&&b.text.trim())||""});
}

function gDiff(n){if(n<=5)return{d:"kolay",cs:3};if(n<=25)return{d:"orta",cs:4};return{d:"zor",cs:5};}

function genLvl(num){
  var info=gDiff(num);
  var ce=Array(info.cs).fill("KELIME").join('","');
  var he=Array(info.cs+2).fill("ipucu").join('","');
  return callAI(
    'Turkce kelime zinciri bulmacasi uret. Seviye '+num+', zorluk: '+info.d+'.\n\n'+
    'SADECE JSON dondur:\n{"chain":["BAS","'+ce+'","SON"],"hints":["'+he+'"],"theme":"Tema","category":"Kategori"}\n\n'+
    'KURALLAR:\n- chain dizisi: baslangic + '+info.cs+' ara + bitis = toplam '+(info.cs+2)+' kelime\n- hints dizisi: HER kelime icin 1 ipucu (chain ile ayni uzunlukta)\n- Tum kelimeler TURKCE, BUYUK HARF, yaygin\n- Her komsu kelime arasinda YARATICI ve GUCLÜ kavramsal bag\n- Cok bariz/kolay baglanti KURMA, yaratici dusun\n- Bilimsel olarak YANLIS baglanti KURMA\n- Ipuclari: kelimeyi vermeden sezdiren siirsel 1 cumle\n- JSON disinda HICBIR sey yazma',800
  ).then(function(txt){
    var c=txt.replace(/```json|```/g,"").trim();
    var p=JSON.parse(c);
    if(!p.chain||!p.hints||p.chain.length!==(info.cs+2)||p.hints.length!==p.chain.length)throw new Error("Bad");
    return{chain:p.chain,hints:p.hints,theme:p.theme||"",category:p.category||"",id:num,difficulty:info.d};
  });
}

function getAIHint(target,hint,prev,next){
  return callAI(

  ).then(null,function(e){return target.length+' harfli, "'+target[0]+'" ile basliyor.'});
}

// ══════ SFX ══════
var SFX={ctx:null,
  gc:function(){if(!this.ctx){var C=window.AudioContext||window.webkitAudioContext;if(C)this.ctx=new C()}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();return this.ctx},
  play:function(type){try{var c=this.gc();if(!c)return;
    // Kompresör — her ses için
    var cmp=c.createDynamicsCompressor();cmp.threshold.value=-12;cmp.ratio.value=6;cmp.attack.value=0.002;cmp.release.value=0.15;

    if(type==='click'){t(880,n,.04);t(1320,n+.01,.03)}
    else if(type==='word'){[440,554,659,880].forEach(function(f,i){t(f,n+i*.06,.7)})}

    else if(type==='error'){var o2=c.createOscillator(),g2=c.createGain();o2.type='sine';o2.frequency.setValueAtTime(180,n);o2.frequency.linearRampToValueAtTime(90,n+.18);g2.gain.setValueAtTime(0,n);g2.gain.linearRampToValueAtTime(0.5,n+.02);g2.gain.linearRampToValueAtTime(0,n+.18);o2.connect(g2);g2.connect(cmp);o2.start(n);o2.stop(n+.2)}

// ══════ MUSIC ENGINE ══════
// Zincir: oscillator → bireysel gain → bus gain → compressor → master(0.35) → destination
// Compressor clipping'i önler. Tüm bireysel gain'ler çok düşük tutulur.
var MUS=(function(){
  var ctx=null,master=null,comp=null,nodes=[],timers=[],running=false,phraseIdx=0;

  // Do minör pentatonik — sadece sine dalgalar (triangle/square cızırtı yapar)
  var BASS_F  = [65.41, 87.31, 116.54];          // C2 F2 Bb2
  var PAD_F   = [130.81,155.56,196.00,261.63];   // C3 Eb3 G3 C4
  var MEL_F   = [261.63,311.13,349.23,392.00,466.16,523.25,622.25,698.46]; // C4→F5

  var PATTERNS=[
    [0,2,4,3,1,0,2,4],
    [4,3,1,0,2,4,3,1],
    [0,1,3,4,2,0,1,3],
    [2,4,3,1,0,2,4,3],
    [0,2,1,3,4,2,0,1],
  ];

  // Oscillator + gain düğümü yarat, bus'a bağla
  function osc(freq, gainVal, bus){
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.value=gainVal;
    o.connect(g); g.connect(bus);
    o.start();
    nodes.push(o,g);
    return{o:o,g:g};
  }

  // Zamanlanmış tek nota — sadece sine, çok düşük gain
  function note(freq,startT,dur,peakVol){
    if(!ctx||!master)return;
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    var atk=0.06, rel=Math.min(dur*0.5,0.4);
    g.gain.setValueAtTime(0,startT);
    g.gain.linearRampToValueAtTime(peakVol,startT+atk);
    g.gain.setValueAtTime(peakVol,startT+dur-rel);
    g.gain.exponentialRampToValueAtTime(0.0001,startT+dur);
    o.connect(g); g.connect(master);
    o.start(startT); o.stop(startT+dur+0.15);
  }

  // Bass drone katmanı — 3 ses, çok düşük seviye
  function startDrone(){
    var bus=ctx.createGain(); bus.gain.value=0.12; bus.connect(comp);
    nodes.push(bus);
    BASS_F.forEach(function(f,i){
      var n=osc(f, i===0?0.5:0.3, bus);
      // Frekans LFO (hafif vibrato)
      var lfo=ctx.createOscillator(), lfg=ctx.createGain();
      lfo.type='sine'; lfo.frequency.value=0.10+i*0.04;
      lfg.gain.value=f*0.003;
      lfo.connect(lfg); lfg.connect(n.o.frequency);
      lfo.start(); nodes.push(lfo,lfg);
    });
  }

  // Pad katmanı — 4 ses, nefes gibi LFO
  function startPads(){
    var bus=ctx.createGain(); bus.gain.value=0.07; bus.connect(comp);
    nodes.push(bus);
    PAD_F.forEach(function(f,i){
      var n=osc(f, [0.6,0.4,0.35,0.3][i], bus);

      var lfo=ctx.createOscillator(), lfg=ctx.createGain();

      lfo.start(); nodes.push(lfo,lfg);
    });
  }

  // Melodik arpej — bus gain ile kontrollü
  function playPhrase(){
    if(!running||!ctx)return;
    var now=ctx.currentTime;
    var pat=PATTERNS[phraseIdx%PATTERNS.length]; phraseIdx++;
    var step=0.40+Math.random()*0.08;
    pat.forEach(function(idx,i){
      var f=MEL_F[idx%MEL_F.length];
      var dur=step*(1.0+Math.random()*0.6);
      note(f, now+i*step, dur, 0.022); // çok düşük peak vol
      if(Math.random()>0.65) note(f*1.498, now+i*step, dur, 0.008);
    });

  }

  return{
    start:function(){
      if(running)return;
      try{
        var AC=window.AudioContext||window.webkitAudioContext;
        if(!AC)return;
        ctx=new AC();
        if(ctx.state==='suspended')ctx.resume();

        // Compressor — clipping'i kesinlikle önler
        comp=ctx.createDynamicsCompressor();
        comp.threshold.value=-18;  // dB — bu seviyenin üstünü sıkıştır
        comp.knee.value=6;
        comp.ratio.value=4;        // 4:1 oran
        comp.attack.value=0.003;
        comp.release.value=0.25;

        // Master gain — compressor çıkışını ölçekle
        master=ctx.createGain();
        master.gain.value=0.35;    // Güvenli seviye

        comp.connect(master);
        master.connect(ctx.destination);

        // Drone ve pad'ler comp'a bağlı (osc→bus→comp)
        // Melodik notalar master'a direkt bağlı ama peak vol 0.022
        running=true; nodes=[]; timers=[]; phraseIdx=0;

          master.gain.linearRampToValueAtTime(0,ctx.currentTime+1.0);
        }catch(e){}
      }
      setTimeout(function(){
        nodes.forEach(function(n){
          try{if(typeof n.stop==='function')n.stop()}catch(e){}
          try{n.disconnect()}catch(e){}

        var fm=fc.createGain(); fm.gain.value=0.12;
        fc2.connect(fm); fm.connect(fc.destination);
        var now=fc.currentTime;
        [261.63,329.63,392,523.25,659.25].forEach(function(f,i){
          var o=fc.createOscillator(),g=fc.createGain();
          o.type='sine'; o.frequency.value=f;
          g.gain.setValueAtTime(0,now+i*0.09);
          g.gain.linearRampToValueAtTime(0.4,now+i*0.09+0.05);
          g.gain.exponentialRampToValueAtTime(0.001,now+i*0.09+0.9);
          o.connect(g); g.connect(fc2); o.start(now+i*0.09); o.stop(now+i*0.09+1.0);
        });
        [523.25,659.25,783.99].forEach(function(f,i){
          var o=fc.createOscillator(),g=fc.createGain();
          o.type='sine'; o.frequency.value=f;
          g.gain.setValueAtTime(0,now+0.52);
          g.gain.linearRampToValueAtTime(0.25-i*0.05,now+0.57);
          g.gain.exponentialRampToValueAtTime(0.001,now+2.0);
          o.connect(g); g.connect(fc2); o.start(now+0.52); o.stop(now+2.1);
        });
      }catch(e){}
    },
    toggle:function(v){if(v)this.start();else this.stop();}
  };
})();

      <BG s={bgS} sh={sh}/>
      <div className="fixed top-0 left-0 right-0 z-30 p-3 flex justify-between items-start" style={{pointerEvents:'none'}}>
        <div style={{pointerEvents:'auto'}} className="flex flex-col gap-1"><h2 className="fh text-base font-bold text-white/80">{user&&user.name}</h2><div className="flex items-center gap-1 flex-wrap"><span className="px-2 py-0.5 rounded-full fm text-white/20" style={{fontSize:'8px',background:'rgba(255,255,255,.03)',border:'1px solid rgba(255,255,255,.04)'}}>{String(lvl+1).padStart(2,'0')}/{MAXL}</span><span className={"px-2 py-0.5 rounded-full font-semibold border "+diff.c} style={{fontSize:'8px',letterSpacing:'.1em'}}>{diff.l}</span>{streak>=SI&&<span className="px-2 py-0.5 rounded-full font-semibold flex items-center gap-0.5" style={{fontSize:'8px',color:'var(--rose)',border:'1px solid rgba(251,113,133,.15)',background:'rgba(251,113,133,.04)'}}><Flame size={9}/>{streak}</span>}</div></div>
        <div style={{pointerEvents:'auto'}} className="flex flex-col items-end gap-1 relative">
          <div className="flex items-center gap-1">
            <button onClick={function(){sfx('click');setMusOn(function(m){return!m})}} className="glass px-2.5 py-1.5 rounded-full flex items-center gap-1" style={{color:musOn?'var(--gold)':'rgba(255,255,255,.1)'}}>
              {musOn?<Music size={12}/>:<Music2 size={12}/>}
              {musOn&&<span className="flex gap-px items-end" style={{height:'10px'}}>{[1,2,3].map(function(b){return <span key={b} className="inline-block w-px rounded-sm" style={{height:(30+b*20)+'%',background:'var(--gold)',animation:'barDance '+(0.4+b*.15)+'s ease-in-out infinite alternate'}}/>})}</span>}
            </button>
            <button onClick={function(){setSfxOn(function(s){return!s})}} className="glass px-2.5 py-1.5 rounded-full" style={{color:sfxOn?'var(--purple)':'rgba(255,255,255,.1)'}}>{sfxOn?<Volume2 size={12}/>:<VolumeX size={12}/>}</button>
            <div className="glass px-2.5 py-1.5 rounded-full flex items-center gap-1"><Sparkles size={11} style={{color:'var(--gold)',opacity:.5}}/><span className="fm font-bold" style={{fontSize:'11px',color:'rgba(246,197,83,.5)'}}>{dust}</span></div>
            <button onClick={function(){sfx('click');setShowMenu(function(m){return!m})}} className="glass px-2.5 py-1.5 rounded-full font-semibold text-white/30" style={{fontSize:'11px'}}>☰</button>
          </div>
          {showMenu&&<div className="absolute top-full right-0 mt-1 w-36 card rounded-xl p-1 shadow-2xl afd z-50">
            <button onClick={function(){sfx('click');setConfirm('quit')}} className="w-full flex items-center gap-2 px-3 py-2.5 rounded-lg hover:bg-white/5 text-white/30"><Home size={11}/><span style={{fontSize:'10px'}}>Ana Menü</span></button>
            <button onClick={function(){sfx('click');setShowMap(true);setShowMenu(false)}} className="w-full flex items-center gap-2 px-3 py-2.5 rounded-lg hover:bg-white/5 text-white/30"><Compass size={11}/><span style={{fontSize:'10px'}}>Atlas</span></button>
          </div>}
        </div>
      </div>
      {toast&&<Toast msg={toast} onDone={function(){setToast(null)}}/>}
      {lvlData&&lvlData.theme&&<div className="fixed bottom-2 left-1/2 -translate-x-1/2 z-10" style={{pointerEvents:'none'}}><span className="fm text-white/4 uppercase" style={{fontSize:'7px',letterSpacing:'.5em'}}>{lvlData.theme}</span></div>}
      <main className="relative z-10 w-full h-screen flex items-center justify-center px-4 pt-14 pb-6">
        <Constellation chain={chain} found={found} sel={sel} onClick={nodeClick} lvl={lvl}/>
      </main>
      {sel!==null&&<Panel chain={chain} hints={hints} sel={sel} guess={guesses[sel]||''} onInput={procInput} onBack={doBack} onClose={function(){sfx('click');setSel(null);setAiTxt(null)}} onLH={doLH} onAI={doAI} onReveal={doReveal} animStar={animStar} hIdx={hIdx} aiTxt={aiTxt} loadAI={loadAI} dust={dust} sRefs={sRefs}/>}
      {animStar&&<div className="fixed z-[100] rounded-full w-2.5 h-2.5" style={{pointerEvents:'none',left:animStar.sx,top:animStar.sy,background:'var(--gold)',boxShadow:'0 0 20px 6px var(--goldGlow)','--tx':animStar.tx+'px','--ty':animStar.ty+'px',animation:'hintFly 1.7s cubic-bezier(.2,0,.2,1) forwards'}}/>}
      {showWin&&<Win chain={chain} theme={lvlData.theme||''} expl={winExpl} loadExpl={loadExpl} streak={streak} cleanW={cleanW} onNext={nextLvl}/>}
      {showMap&&<LevelMap lvl={lvl} maxL={maxL} onSel={function(i){sfx('click');setLvl(i);setScreen('PLAY');setShowMap(false)}} onClose={function(){sfx('click');setShowMap(false)}}/>}
      {showTut&&<Tutorial onDone={function(){setShowTut(false);LS.s('tutDone',true)}}/>}
      <Confirm cfg={confirm?cfgs[confirm]:null} onNo={function(){sfx('click');setConfirm(null)}} onYes={function(){doConfirm(confirm)}}/>
    </div>
  );
}
createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
