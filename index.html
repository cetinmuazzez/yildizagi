/* ─── SFX ─── */
const sfxPlay=(type)=>{
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const ctx=new C();const m=ctx.createGain();m.gain.value=0.06;m.connect(ctx.destination);const n=ctx.currentTime;
    const t=(f,s,d,v=0.5)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+0.02);g.gain.exponentialRampToValueAtTime(0.001,s+d);o.connect(g);g.connect(m);o.start(s);o.stop(s+d)};
    if(type==='click'){t(880,n,0.04);t(1320,n+0.01,0.03)}
    else if(type==='word'){[440,554,659,880].forEach((f,i)=>t(f,n+i*0.06,0.7))}
    else if(type==='level'){for(let i=0;i<10;i++)t(220*Math.pow(1.4,i/2),n+i*0.04,2)}
    else if(type==='error'){t(150,n,0.15,0.2)}
    else if(type==='reward'){[587,740,880,1175].forEach((f,i)=>t(f,n+i*0.04,0.9,0.35))}
  }catch(e){}
};

/* ─── MUSIC ─── */
let mCtx=null,mGain=null,mOscs=[],mTimers=[],mOn=false;
const mStart=()=>{
  if(mOn)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    mCtx=new C();if(mCtx.state==='suspended')mCtx.resume();
    mGain=mCtx.createGain();mGain.gain.setValueAtTime(0,mCtx.currentTime);mGain.gain.linearRampToValueAtTime(0.015,mCtx.currentTime+5);mGain.connect(mCtx.destination);mOn=true;mOscs=[];
    [130.81,164.81,196].forEach((f,i)=>{const o=mCtx.createOscillator(),g=mCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.value=[0.25,0.18,0.12][i];o.connect(g);g.connect(mGain);o.start();mOscs.push(o)});
    const notes=[261.63,329.63,392,440,523.25];
    const play=()=>{if(!mOn||!mCtx)return;const now=mCtx.currentTime;for(let i=0;i<2;i++){const f=notes[Math.floor(Math.random()*notes.length)];const o=mCtx.createOscillator(),g=mCtx.createGain();o.type='sine';o.frequency.value=f;const s=now+i*0.8,d=3+Math.random()*2;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(0.01,s+0.5);g.gain.linearRampToValueAtTime(0,s+d);o.connect(g);g.connect(mGain);o.start(s);o.stop(s+d+0.1)}mTimers.push(setTimeout(play,10000+Math.random()*12000))};
    mTimers.push(setTimeout(play,5000));
  }catch(e){}
};
const mStop=()=>{mOn=false;mTimers.forEach(t=>clearTimeout(t));mTimers=[];if(mGain&&mCtx){try{mGain.gain.linearRampToValueAtTime(0,mCtx.currentTime+1)}catch(e){}}setTimeout(()=>{mOscs.forEach(o=>{try{o.stop()}catch(e){}});mOscs=[];try{if(mCtx)mCtx.close()}catch(e){};mCtx=null;mGain=null},1500)};

/* ─── API ─── */
const callAI=async(prompt,mt=600)=>{
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:MODEL,max_tokens:mt,messages:[{role:"user",content:prompt}]})});
  if(!r.ok)throw new Error("API "+r.status);const d=await r.json();const b=(d.content||[]).find(x=>x.type==="text");return(b&&b.text)?b.text.trim():""
};
const getAIHint=async(target,hint)=>{
  try{return await callAI(`Kelime bulmacasi ipucu. Hedef: "${target}" (SOYLEME!). Mevcut: "${hint}". Kelimeyi soylemeden 1-2 cumle ipucu yaz.`,150)}
  catch(e){return `${target.length} harfli, "${target[0]}" ile basliyor.`}
};

function App(){
  const[user,setUser]=useState(null);
  const[screen,setScreen]=useState('AUTH');
  const[lvl,setLvl]=useState(0);
  const[lvlData,setLvlData]=useState(null);
  const[maxL,setMaxL]=useState(0);
  const[found,setFound]=useState([]);
  const[guesses,setGuesses]=useState({});
  const[sel,setSel]=useState(null);
  const[hintN,setHintN]=useState(new Set());
  const[streak,setStreak]=useState(0);
  const[showWin,setShowWin]=useState(false);
  const[winExpl,setWinExpl]=useState('');
  const[loadExpl,setLoadExpl]=useState(false);
  const[toast,setToast]=useState(null);
  const[dust,setDust]=useState(15);
  const[sfxOn,setSfxOn]=useState(true);
  const[musOn,setMusOn]=useState(false);
  const[aiTxt,setAiTxt]=useState(null);
  const[loadAI,setLoadAI]=useState(false);
  const[animStar,setAnimStar]=useState(null);
  const[hIdx,setHIdx]=useState(null);
  const sfxRef=useRef(true);
  const sRefs=useRef([]);
  const[authMode,setAuthMode]=useState('login');
  const[authEmail,setAuthEmail]=useState('');
  const[authName,setAuthName]=useState('');
  const[authErr,setAuthErr]=useState(null);

  useEffect(()=>{sfxRef.current=sfxOn},[sfxOn]);
  const sfx=(t)=>{if(sfxRef.current)sfxPlay(t)};

  // Music
  useEffect(()=>{if(musOn)mStart();else mStop();return()=>mStop()},[musOn]);

  // Toast auto-clear
  useEffect(()=>{if(toast){const t=setTimeout(()=>setToast(null),2500);return()=>clearTimeout(t)}},[toast]);

  // Init
  useEffect(()=>{
    const em=LS.g('cur');
    if(em){const us=LS.g('users',{});if(us[em]){doAuth(us[em]);return}}
  },[]);

  const doAuth=(u)=>{setUser(u);setLvl(u.level||0);setMaxL(u.maxLevel||0);setDust(u.dust||15);setStreak(u.streak||0);setScreen('HOME')};
  const save=(up={})=>{const em=LS.g('cur');if(!em)return;const us=LS.g('users',{});const u=us[em];if(!u)return;Object.assign(u,up);us[em]=u;LS.s('users',us)};
  useEffect(()=>{if(user)save({level:lvl,maxLevel:maxL,dust,streak})},[lvl,maxL,dust,streak]);

  // Load level
  useEffect(()=>{
    if(!user)return;
    setFound([]);setGuesses({});setSel(null);setShowWin(false);setWinExpl('');setToast(null);setAnimStar(null);setHIdx(null);setAiTxt(null);setHintN(new Set());
    const b=BASE.find(l=>l.id===(lvl+1));
    setLvlData(b||BASE[lvl%15]);
  },[lvl,user]);

  const chain=lvlData?lvlData.chain:[];
  const hints=lvlData?lvlData.hints:[];
  const total=chain.length;
  const shape=useMemo(()=>getSh(total,lvl),[total,lvl]);

  // ── Game logic ──
  const nodeClick=(i)=>{sfx('click');if(found.includes(i))return;if(i>0&&!found.includes(i-1)){sfx('error');setToast("\u00d6nce \u00f6nceki y\u0131ld\u0131z\u0131 ayd\u0131nlat");return}setSel(i);setToast(null);setAiTxt(null)};

  const procInput=(val)=>{if(sel===null)return;sfx('click');const target=chain[sel];const upper=val.toLocaleUpperCase('tr-TR');if(upper.length<=target.length){setGuesses(g=>({...g,[sel]:upper}));if(upper===target)correct(sel)}};

  const doBack=()=>{sfx('click');if(sel===null)return;const c=guesses[sel]||'';if(c.length>0)setGuesses(g=>({...g,[sel]:c.slice(0,-1)}))};

  const correct=(idx)=>{
    sfx('word');const nf=[...found,idx];setFound(nf);
    const used=hintN.has(idx);setDust(d=>d+1+(used?0:1));sfx('reward');
    if(!used){const ns=streak+1;setStreak(ns);if(ns>0&&ns%3===0){setDust(d=>d+1);setToast(`\uD83D\uDD25 ${ns} seri! +1 bonus`)}}else setStreak(0);
    setTimeout(()=>{setSel(null);if(nf.length===total){setTimeout(async()=>{sfx('level');setShowWin(true);setLoadExpl(true);try{const e=await callAI(`Bu kelime zincirinin anlam yolculugunu 2-3 cumleyle anlat: ${chain.join(" \u2192 ")}`,250);setWinExpl(e)}catch(e){setWinExpl("Tak\u0131my\u0131ld\u0131z\u0131 tamamland\u0131!")}setLoadExpl(false)},400)}},400)
  };

  const doLH=()=>{
    if(sel===null||animStar)return;if(dust<1){sfx('error');setToast("Y\u0131ld\u0131z tozu yetersiz");return}sfx('click');setHintN(s=>new Set(s).add(sel));
    const target=chain[sel],cur=(guesses[sel]||'').toLocaleUpperCase('tr-TR');let ni=0;for(let i=0;i<target.length;i++){if(cur[i]!==target[i]){ni=i;break}ni=i+1}if(ni>=target.length)return;
    setDust(d=>d-1);const sl=sRefs.current[ni];if(!sl)return;const r=sl.getBoundingClientRect();const sx=window.innerWidth*0.85,sy=40;
    setAnimStar({sx,sy,tx:r.left+r.width/2-sx,ty:r.top+r.height/2-sy});
    setTimeout(()=>{const nc=target[ni],nv=cur.substring(0,ni)+nc+cur.substring(ni+1);setGuesses(g=>({...g,[sel]:nv}));setHIdx(ni);setTimeout(()=>setHIdx(null),800);if(nv===target)correct(sel);setAnimStar(null)},1700)
  };

  const doAI=async()=>{
    if(sel===null)return;if(dust<2){sfx('error');setToast("Yetersiz (2 gerekli)");return}sfx('click');setHintN(s=>new Set(s).add(sel));setDust(d=>d-2);setLoadAI(true);setAiTxt(null);
    const h=await getAIHint(chain[sel],hints[sel]);setAiTxt(h);setLoadAI(false)
  };

  const doReveal=()=>{
    if(sel===null)return;if(dust<3){sfx('error');setToast("Yetersiz (3 gerekli)");return}sfx('click');setHintN(s=>new Set(s).add(sel));setDust(d=>d-3);setGuesses(g=>({...g,[sel]:chain[sel]}));correct(sel)
  };

  const nextLvl=()=>{sfx('click');setDust(d=>d+3);const n=lvl+1;if(n>maxL)setMaxL(n);setLvl(n<MAXL?n:0);setScreen('PLAY');setShowWin(false)};

  /* ═══ AUTH ═══ */
  if(screen==='AUTH'){
    const doReg=()=>{if(!authName.trim()){setAuthErr("\u0130sim gerekli");return}if(!authEmail.includes('@')){setAuthErr("Ge\u00e7erli e-posta gir");return}const em=authEmail.trim().toLowerCase();const us=LS.g('users',{});if(us[em]){setAuthErr("Zaten kay\u0131tl\u0131");return}const u={name:authName.trim().toLocaleUpperCase('tr-TR'),email:em,dust:15,level:0,maxLevel:0,streak:0};us[em]=u;LS.s('users',us);LS.s('cur',em);doAuth(u)};
    const doLog=()=>{if(!authEmail.trim()){setAuthErr("E-posta gir");return}const em=authEmail.trim().toLowerCase();const us=LS.g('users',{});if(!us[em]){setAuthErr("Bulunamad\u0131");return}LS.s('cur',em);doAuth(us[em])};
    return(
      <div className="fixed inset-0 flex items-center justify-center p-5" style={{background:'radial-gradient(ellipse at 50% 30%,#12122e,#0a0a1a)'}}>
        <div className="flex flex-col items-center gap-6 w-full max-w-sm">
          <div className="text-center"><BrainCircuit size={40} style={{color:'#f6c553',margin:'0 auto 12px'}}/><h1 className="fh text-4xl font-bold" style={{background:'linear-gradient(135deg,#f6c553,#fff,#a78bfa)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>Y\u0131ld\u0131z A\u011f\u0131</h1></div>
          <div className="w-full rounded-2xl p-5" style={{background:'rgba(8,8,28,0.95)',border:'1px solid rgba(255,255,255,0.06)'}}>
            <div className="flex gap-1 mb-4 p-1 rounded-xl" style={{background:'rgba(255,255,255,0.04)'}}>
              <button onClick={()=>{setAuthMode('login');setAuthErr(null)}} className={`flex-1 py-2.5 rounded-lg text-xs font-bold tracking-widest ${authMode==='login'?'bg-white/10 text-white':'text-white/25'}`}>G\u0130R\u0130\u015e</button>
              <button onClick={()=>{setAuthMode('register');setAuthErr(null)}} className={`flex-1 py-2.5 rounded-lg text-xs font-bold tracking-widest ${authMode==='register'?'bg-white/10 text-white':'text-white/25'}`}>KAYIT</button>
            </div>
            {authMode==='register'&&<div className="mb-3 relative"><User size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-white/15"/><input value={authName} onChange={e=>setAuthName(e.target.value)} placeholder="\u0130smin..." className="w-full rounded-xl py-3.5 pl-9 pr-3 text-sm fm outline-none bg-white/5 border border-white/6 text-white placeholder:text-white/15"/></div>}
            <div className="mb-3 relative"><Mail size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-white/15"/><input type="email" value={authEmail} onChange={e=>{setAuthEmail(e.target.value);setAuthErr(null)}} onKeyDown={e=>{if(e.key==='Enter')authMode==='register'?doReg():doLog()}} placeholder="E-posta..." className="w-full rounded-xl py-3.5 pl-9 pr-3 text-sm fm outline-none bg-white/5 border border-white/6 text-white placeholder:text-white/15"/></div>
            {authErr&&<p className="text-rose-400 text-xs text-center mb-2">{authErr}</p>}
            <button onClick={authMode==='register'?doReg:doLog} className="w-full py-4 rounded-xl text-base font-bold tracking-widest" style={{background:'#f6c553',color:'#0a0a1a'}}>{authMode==='register'?'KAYIT OL':'G\u0130R\u0130\u015e YAP'}</button>
          </div>
        </div>
      </div>
    );
  }

  /* ═══ HOME ═══ */
  if(screen==='HOME'){
    return(
      <div className="fixed inset-0 flex items-center justify-center p-5" style={{background:'radial-gradient(ellipse at 50% 30%,#12122e,#0a0a1a)'}}>
        <div className="flex flex-col items-center gap-5 w-full max-w-sm">
          <div className="text-center"><BrainCircuit size={32} style={{color:'#f6c553',margin:'0 auto 8px'}}/><h1 className="fh text-3xl font-bold" style={{background:'linear-gradient(135deg,#f6c553,#fff,#a78bfa)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>Y\u0131ld\u0131z A\u011f\u0131</h1></div>
          <div className="w-full rounded-2xl p-5" style={{background:'rgba(8,8,28,0.95)',border:'1px solid rgba(255,255,255,0.06)'}}>
            <div className="flex items-center gap-3 mb-4 pb-3" style={{borderBottom:'1px solid rgba(255,255,255,0.05)'}}>
              <div className="w-10 h-10 rounded-full flex items-center justify-center" style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.06)'}}><User size={16} style={{color:'#f6c553'}}/></div>
              <div className="flex-1"><p className="font-bold text-sm">{user&&user.name}</p><p className="fm text-white/20" style={{fontSize:'9px'}}>{user&&user.email}</p></div>
              <div className="flex items-center gap-1 px-3 py-1.5 rounded-full" style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.06)'}}><Sparkles size={12} style={{color:'#f6c553'}}/><span className="fm font-bold text-sm" style={{color:'#f6c553'}}>{dust}</span></div>
            </div>
            <div className="flex gap-2 mb-4">
              <button onClick={()=>setSfxOn(s=>!s)} className="flex-1 py-3 rounded-xl text-xs font-bold tracking-widest flex items-center justify-center gap-2" style={{background:sfxOn?'rgba(167,139,250,0.08)':'rgba(255,255,255,0.03)',border:sfxOn?'1px solid rgba(167,139,250,0.2)':'1px solid rgba(255,255,255,0.05)',color:sfxOn?'#a78bfa':'rgba(255,255,255,0.2)'}}>
                {sfxOn?<Volume2 size={14}/>:<VolumeX size={14}/>}EFEKT
              </button>
              <button onClick={()=>setMusOn(m=>!m)} className="flex-1 py-3 rounded-xl text-xs font-bold tracking-widest flex items-center justify-center gap-2" style={{background:musOn?'rgba(246,197,83,0.08)':'rgba(255,255,255,0.03)',border:musOn?'1px solid rgba(246,197,83,0.2)':'1px solid rgba(255,255,255,0.05)',color:musOn?'#f6c553':'rgba(255,255,255,0.2)'}}>
                {musOn?<Music size={14}/>:<Music2 size={14}/>}M\u00dcZ\u0130K
              </button>
            </div>
            <button onClick={()=>{sfx('click');setScreen('PLAY')}} className="w-full py-4 rounded-xl text-base font-bold tracking-widest mb-3" style={{background:'#f6c553',color:'#0a0a1a'}}>{maxL>0?'DEVAM ET':'BA\u015eLA'}</button>
            <button onClick={()=>{LS.r('cur');setUser(null);setScreen('AUTH');mStop()}} className="w-full py-2.5 rounded-xl text-xs font-semibold tracking-widest text-white/15 flex items-center justify-center gap-1"><LogOut size={12}/>\u00c7IKI\u015e</button>
          </div>
        </div>
      </div>
    );
  }

  /* ═══ PLAY ═══ */
  return(
    <div className="fixed inset-0" style={{background:'radial-gradient(ellipse at 50% 25%,#0c0c2a,#060618 40%,#030311 75%)'}}>
      {/* HUD */}
      <div className="fixed top-0 left-0 right-0 z-30 p-3 flex justify-between items-center">
        <div><h2 className="fh text-sm font-bold text-white/70">{user&&user.name}</h2><span className="fm text-white/20" style={{fontSize:'9px'}}>{String(lvl+1).padStart(2,'0')}/{MAXL}</span></div>
        <div className="flex items-center gap-1.5">
          <button onClick={()=>setMusOn(m=>!m)} className="px-2 py-1.5 rounded-full" style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.06)',color:musOn?'#f6c553':'rgba(255,255,255,0.15)'}}>{musOn?<Music size={13}/>:<Music2 size={13}/>}</button>
          <button onClick={()=>setSfxOn(s=>!s)} className="px-2 py-1.5 rounded-full" style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.06)',color:sfxOn?'#a78bfa':'rgba(255,255,255,0.15)'}}>{sfxOn?<Volume2 size={13}/>:<VolumeX size={13}/>}</button>
          <div className="px-2.5 py-1.5 rounded-full flex items-center gap-1" style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.06)'}}><Sparkles size={12} style={{color:'#f6c553',opacity:0.6}}/><span className="fm font-bold" style={{fontSize:'12px',color:'rgba(246,197,83,0.6)'}}>{dust}</span></div>
          <button onClick={()=>{sfx('click');setScreen('HOME')}} className="px-2 py-1.5 rounded-full text-white/20" style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.06)'}}><Home size={13}/></button>
        </div>
      </div>

      {/* Toast */}
      {toast&&<div className="fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-5 py-2 rounded-full text-xs font-medium text-white/80 af" style={{background:'rgba(8,8,28,0.95)',border:'1px solid rgba(255,255,255,0.06)'}}>{toast}</div>}

      {/* CONSTELLATION */}
      <div className="absolute inset-0 pt-14 pb-4 px-4">
        {/* SVG lines */}
        <svg className="absolute inset-0 w-full h-full" style={{pointerEvents:'none',top:'56px',bottom:'16px',left:'16px',right:'16px',width:'calc(100% - 32px)',height:'calc(100% - 72px)'}}>
          <defs>
            <linearGradient id="gl"><stop offset="0%" stopColor="#f6c553" stopOpacity="0.8"/><stop offset="100%" stopColor="#a78bfa" stopOpacity="0.6"/></linearGradient>
            <filter id="gf"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          {shape.map((s,i)=>{
            if(i>=total-1)return null;const ns=shape[i+1];const bothDone=found.includes(i)&&found.includes(i+1);
            return(<g key={`l${i}`}>
              <line x1={`${s.x}%`} y1={`${s.y}%`} x2={`${ns.x}%`} y2={`${ns.y}%`} stroke="rgba(167,139,250,0.15)" strokeWidth="1.5" strokeDasharray="6 10"/>
              {bothDone&&<line x1={`${s.x}%`} y1={`${s.y}%`} x2={`${ns.x}%`} y2={`${ns.y}%`} stroke="url(#gl)" strokeWidth="3" filter="url(#gf)" strokeDasharray="500" style={{animation:'lineDraw 1s ease-out forwards'}}/>}
            </g>)
          })}
        </svg>

        {/* Nodes */}
        {shape.map((s,i)=>{
          const solved=found.includes(i);const isNext=!solved&&(i===0||found.includes(i-1));const locked=!solved&&!isNext;const isSel=sel===i;
          return(
            <div key={`n${i}`} onClick={()=>nodeClick(i)} className={`absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center transition-all duration-500 ${isNext?'cursor-pointer z-20':'z-10'} ${locked?'opacity-[0.06]':'opacity-100'}`} style={{left:`${s.x}%`,top:`calc(56px + ${s.y}% * (100% - 72px) / 100%)`,transform:`translate(-50%,-50%) scale(${isSel?1.2:isNext?1.1:1})`,gap:'10px'}}>
              <div className={`relative flex items-center justify-center ${solved?'w-16 h-16':'w-12 h-12'}`}>
                {solved&&<><div className="absolute -inset-2 rounded-full" style={{boxShadow:'0 0 30px rgba(246,197,83,0.2)',animation:'pulseGlow 3s infinite'}}/><div className="absolute inset-0 rounded-full" style={{border:'1px solid rgba(246,197,83,0.15)',animation:'ripple 4s ease-out infinite'}}/></>}
                <div className={`w-full h-full rounded-full flex items-center justify-center border-2 ${isNext?'ang':''}`} style={{background:solved?'rgba(246,197,83,0.1)':isNext?'rgba(167,139,250,0.06)':'rgba(255,255,255,0.02)',borderColor:solved?'rgba(246,197,83,0.3)':isNext?'rgba(167,139,250,0.25)':'rgba(255,255,255,0.05)',boxShadow:solved?'0 0 20px rgba(246,197,83,0.15)':'none'}}>
                  {solved?<Star size={18} fill="#f6c553" style={{color:'#f6c553'}}/>:isNext?<div className="w-3 h-3 rounded-full animate-pulse" style={{background:'#a78bfa',boxShadow:'0 0 12px rgba(167,139,250,0.2)'}}/>:<div className="w-1.5 h-1.5 rounded-full bg-white/8"/>}
                </div>
                {(isNext||isSel)&&<div className="absolute -inset-2 rounded-full aor" style={{border:'1px solid rgba(167,139,250,0.08)'}}/>}
              </div>
              <span className="font-bold tracking-widest px-3 py-1.5 rounded-full" style={{fontSize:'11px',color:solved?'rgba(246,197,83,0.9)':isNext?'rgba(167,139,250,0.8)':'rgba(255,255,255,0.06)',background:solved?'rgba(246,197,83,0.06)':isNext?'rgba(167,139,250,0.06)':'transparent',border:solved?'1px solid rgba(246,197,83,0.15)':isNext?'1px solid rgba(167,139,250,0.15)':'none'}}>{solved?chain[i]:"?"}</span>
            </div>
          )
        })}
      </div>

      {/* INPUT PANEL */}
      {sel!==null&&(
        <div className="fixed inset-0 z-40 flex items-end justify-center" style={{pointerEvents:'none'}}>
          <div className="w-full flex flex-col items-center asu" style={{pointerEvents:'auto',background:'rgba(8,8,28,0.98)',borderRadius:'28px 28px 0 0',borderTop:'2px solid rgba(246,197,83,0.12)',maxHeight:'88vh'}}>
            <div className="w-full px-4 pt-3 pb-1 flex items-start justify-between">
              <div className="flex-1 text-center px-4"><p className="fm text-white/15 uppercase mb-1" style={{fontSize:'8px',letterSpacing:'0.4em'}}>BA\u011eLANTIYI KUR</p><p className="text-white/60" style={{fontSize:'15px',lineHeight:'1.5'}}>{hints[sel]}</p></div>
              <button onClick={()=>{sfx('click');setSel(null);setAiTxt(null)}} className="text-white/20 hover:text-white/50 p-2"><X size={22}/></button>
            </div>
            {(aiTxt||loadAI)&&<div className="w-full px-4 pb-1 af"><div className="px-4 py-2.5 rounded-xl text-center" style={{background:'rgba(167,139,250,0.06)',border:'1px solid rgba(167,139,250,0.12)'}}>{loadAI?<div className="flex items-center justify-center gap-2" style={{color:'rgba(167,139,250,0.4)'}}><Loader2 size={14} className="animate-spin"/><span style={{fontSize:'12px'}}>D\u00fc\u015F\u00fcn\u00fcyor...</span></div>:<p style={{color:'rgba(167,139,250,0.7)',fontSize:'12px',lineHeight:'1.6',fontStyle:'italic'}}>{aiTxt}</p>}</div></div>}
            <div className="relative w-full flex justify-center py-2 px-3">
              <div className="flex gap-2.5 justify-center flex-wrap">
                {Array.from({length:chain[sel].length}).map((_,ci)=>{const ch=(guesses[sel]||'')[ci];const isH=hIdx===ci;return(
                  <div key={ci} ref={el=>{sRefs.current[ci]=el}} className="rounded-xl flex items-center justify-center fm font-bold" style={{width:'46px',height:'58px',fontSize:'26px',color:isH?'rgba(246,197,83,0.9)':ch?'white':'rgba(255,255,255,0.1)',background:isH?'rgba(246,197,83,0.12)':ch?'rgba(255,255,255,0.06)':'rgba(255,255,255,0.02)',border:isH?'2px solid rgba(246,197,83,0.35)':ch?'2px solid rgba(255,255,255,0.12)':'2px solid rgba(255,255,255,0.06)',...(isH?{animation:'letterPop 0.4s',boxShadow:'0 0 18px rgba(246,197,83,0.25)'}:{})}}>{ch||'\u00B7'}</div>
                )})}
              </div>
            </div>
            <div className="flex gap-2 px-4 pb-2 w-full justify-center">
              <button onClick={doLH} disabled={!!animStar||dust<1} className="flex-1 flex items-center justify-center gap-2 py-3 rounded-xl border disabled:opacity-15 active:scale-95" style={{background:'rgba(255,255,255,0.02)',borderColor:'rgba(246,197,83,0.2)',color:'#f6c553'}}><Lightbulb size={16}/><span className="font-bold" style={{fontSize:'12px'}}>HARF</span></button>
              <button onClick={doAI} disabled={loadAI||dust<2} className="flex-1 flex items-center justify-center gap-2 py-3 rounded-xl border disabled:opacity-15 active:scale-95" style={{background:'rgba(255,255,255,0.02)',borderColor:'rgba(167,139,250,0.2)',color:'#a78bfa'}}>{loadAI?<Loader2 size={16} className="animate-spin"/>:<Zap size={16}/>}<span className="font-bold" style={{fontSize:'12px'}}>AI</span></button>
              <button onClick={doReveal} disabled={dust<3} className="flex-1 flex items-center justify-center gap-2 py-3 rounded-xl border disabled:opacity-15 active:scale-95" style={{background:'rgba(255,255,255,0.02)',borderColor:'rgba(251,113,133,0.2)',color:'#fb7185'}}>{dust<3?<Lock size={16}/>:<Eye size={16}/>}<span className="font-bold" style={{fontSize:'12px'}}>\u00c7\u00d6Z</span></button>
            </div>
            <div className="w-full flex flex-col gap-1.5 px-1 pt-1 pb-7">
              {KB.map((row,ri)=>(
                <div key={ri} className="flex justify-center gap-1">
                  {row.map(ch=>(
                    <button key={ch} onClick={()=>procInput((guesses[sel]||'')+ch)} className="kb flex-1 rounded-xl fm font-bold flex items-center justify-center text-white" style={{height:'54px',maxWidth:'50px',fontSize:'17px',background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.08)'}}>{ch}</button>
                  ))}
                  {ri===2&&<button onClick={doBack} className="kb rounded-xl flex items-center justify-center" style={{height:'54px',width:'72px',background:'rgba(251,113,133,0.06)',border:'1px solid rgba(251,113,133,0.12)',color:'rgba(255,255,255,0.4)'}}><Delete size={22}/></button>}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* HINT STAR */}
      {animStar&&<div className="fixed z-[100] rounded-full w-2.5 h-2.5" style={{pointerEvents:'none',left:animStar.sx,top:animStar.sy,background:'#f6c553',boxShadow:'0 0 20px 6px rgba(246,197,83,0.25)','--tx':animStar.tx+'px','--ty':animStar.ty+'px',animation:'hintFly 1.7s cubic-bezier(0.2,0,0.2,1) forwards'}}/>}

      {/* WIN */}
      {showWin&&(
        <div className="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-4 overflow-y-auto">
          <div className="flex flex-col items-center gap-4 max-w-sm w-full text-center af">
            <div className="w-20 h-20 rounded-full flex items-center justify-center" style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.06)'}}><Star size={30} fill="#f6c553" style={{color:'#f6c553'}}/></div>
            <h2 className="fh text-3xl font-bold" style={{background:'linear-gradient(135deg,#f6c553,#fff,#a78bfa)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>Ba\u011flant\u0131 Kuruldu</h2>
            <div className="flex items-center gap-1 flex-wrap justify-center">{chain.map((w,i)=>(<React.Fragment key={i}><span className="fm font-semibold px-2 py-1 rounded-lg" style={{fontSize:'9px',color:'rgba(246,197,83,0.7)',background:'rgba(246,197,83,0.06)',border:'1px solid rgba(246,197,83,0.12)'}}>{w}</span>{i<chain.length-1&&<ChevronRight size={8} className="text-white/10"/>}</React.Fragment>))}</div>
            <div className="w-full rounded-xl p-3 min-h-12 flex items-center justify-center" style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.06)'}}>{loadExpl?<Loader2 size={12} className="animate-spin text-white/20"/>:<p className="text-white/35 italic" style={{fontSize:'11px',lineHeight:'1.6'}}>{winExpl}</p>}</div>
            <button onClick={nextLvl} className="w-full py-4 rounded-xl text-base font-bold tracking-widest" style={{background:'#f6c553',color:'#0a0a1a'}}>DEVAM ET</button>
          </div>
        </div>
      )}
    </div>
  );
}

createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
