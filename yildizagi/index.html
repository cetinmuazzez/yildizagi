<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yıldız Ağı</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'spin-slow': 'spin 10s linear infinite',
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: black; color: white; margin: 0; overflow: hidden; touch-action: manipulation; }
        /* Mobil tarayıcılarda kaydırmayı engelleme ve tam ekran hissi */
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Star, Sparkles, HelpCircle, ChevronRight, RefreshCcw, BrainCircuit, Lightbulb, X, Eye, Lock, Play, User, Grid, Home, LogOut, Map, Volume2, VolumeX, AlertTriangle, ArrowRight, ArrowLeft, Delete } from 'lucide-react';

        // --- 100 SEVİYE VERİSİ ---
        const LEVELS = [
          { id: 1, startWord: "KAKTÜS", endWord: "BALE", chain: ["DİKEN", "BATMAK", "UÇ", "PARMAK"], hints: ["Bitkinin savunma mekanizması?", "Sivri cisim teması?", "Her şeyin bir sonu/kenarı.", "El/ayak uzuvları."] },
          { id: 2, startWord: "GECE", endWord: "SİNEMA", chain: ["KARANLIK", "ODA", "PERDE", "FİLM"], hints: ["Işık yokluğu.", "Dört duvarlı mekan.", "Pencere örtüsü.", "Beyaz perdedeki eser."] },
          { id: 3, startWord: "ATOM", endWord: "EVREN", chain: ["PARÇACIK", "KÜTLE", "YERÇEKİMİ", "GALAKSİ"], hints: ["Maddenin yapı taşı.", "Değişmeyen madde miktarı.", "Newton'un kuvveti.", "Yıldız sistemi."] },
          { id: 4, startWord: "KİTAP", endWord: "ORMAN", chain: ["KAĞIT", "AĞAÇ", "YAPRAK", "DOĞA"], hints: ["Sayfaların malzemesi.", "Kağıdın hammaddesi.", "Dalın yeşil uzvu.", "Canlıların evi."] },
          { id: 5, startWord: "MÜZİK", endWord: "MATEMATİK", chain: ["NOTA", "RİTİM", "SAYI", "DENKLEM"], hints: ["Müziğin harfi.", "Zamanın ahengi.", "Matematiğin birimi.", "Eşitlik ifadesi."] },
          { id: 6, startWord: "GÖZ", endWord: "GÜNEŞ", chain: ["GÖRMEK", "IŞIK", "SICAK", "YAZ"], hints: ["Gözün işlevi.", "Görsel enerji.", "Isısı yüksek.", "Sıcak mevsim."] },
          { id: 7, startWord: "ZAMAN", endWord: "KUM", chain: ["SAAT", "CAM", "PLAJ", "ÇÖL"], hints: ["Zaman ölçer.", "Kum saati fanusu.", "Deniz kıyısı.", "Kurak arazi."] },
          { id: 8, startWord: "DNA", endWord: "MİRAS", chain: ["GEN", "HÜCRE", "YAŞAM", "SOY"], hints: ["Kalıtım birimi.", "Canlı yapı taşı.", "Hayat.", "Aile kökeni."] },
          { id: 9, startWord: "ARKEOLOJİ", endWord: "GELECEK", chain: ["KAZI", "TARİH", "BUGÜN", "YARIN"], hints: ["Toprak araştırması.", "Geçmiş bilimi.", "Şimdiki zaman.", "Ertesi gün."] },
          { id: 10, startWord: "KAOS", endWord: "KOZMOS", chain: ["KARMAŞA", "DÜZEN", "SİSTEM", "EVREN"], hints: ["Karışıklık.", "İntizam.", "Bütünleşik yapı.", "Kainat."] },
          { id: 100, startWord: "YILDIZ", endWord: "AĞI", chain: ["IŞIK", "BAĞLANTI", "YOL", "ÖRGÜ"], hints: ["Parlaklık.", "İletişim.", "Güzergah.", "Dokuma."] }
        ];

        // Seviye eksikse doldurma
        for(let i=10; i<99; i++) {
            if(!LEVELS[i]) {
                LEVELS[i] = { id: i+1, startWord: "TEST", endWord: "TEST", chain: ["A", "B", "C", "D"], hints: ["-","-","-","-"] };
            }
        }

        // TÜRKÇE QWERTY DÜZENİ
        const KEYBOARD_ROWS = [
            ["E", "R", "T", "Y", "U", "I", "O", "P", "Ğ", "Ü"],
            ["A", "S", "D", "F", "G", "H", "J", "K", "L", "Ş", "İ"],
            ["Z", "C", "V", "B", "N", "M", "Ö", "Ç"]
        ];

        // --- "PERİ TOZU" SES MOTORU v3.1 ---
        const playSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                const masterGain = ctx.createGain();
                masterGain.connect(ctx.destination);
                masterGain.gain.value = 0.15; 

                const playSoftTone = (freq, startTime, duration, type = 'sine') => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type; 
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0, startTime);
                    gain.gain.linearRampToValueAtTime(0.8, startTime + 0.05); 
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration); 
                    osc.connect(gain);
                    gain.connect(masterGain);
                    osc.start(startTime);
                    osc.stop(startTime + duration);
                };

                if (type === 'click') {
                    playSoftTone(600, now, 0.1, 'sine');
                    playSoftTone(1200, now + 0.02, 0.05, 'sine'); 
                } else if (type === 'wordFound') {
                    const notes = [329.63, 392.00, 523.25]; // E4, G4, C5 (C Major)
                    notes.forEach((freq, i) => {
                        playSoftTone(freq, now + i * 0.1, 1.5, 'sine');
                    });
                } else if (type === 'levelComplete') {
                    const startFreq = 200;
                    const steps = 15;
                    for(let i=0; i<steps; i++) {
                        const freq = startFreq * Math.pow(1.5, i/2); 
                        playSoftTone(freq, now + i * 0.08, 2.5, 'sine');
                    }
                    setTimeout(() => {
                         playSoftTone(523.25, ctx.currentTime, 3.0, 'sine'); 
                         playSoftTone(659.25, ctx.currentTime, 3.0, 'sine'); 
                         playSoftTone(783.99, ctx.currentTime, 3.0, 'sine'); 
                         playSoftTone(1046.50, ctx.currentTime, 3.0, 'sine'); 
                    }, steps * 0.08);

                } else if (type === 'hint') {
                    const count = 10;
                    for(let i=0; i<count; i++) {
                        const randomFreq = 1000 + Math.random() * 2000;
                        const randomTime = now + (Math.random() * 0.5); 
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = randomFreq;
                        gain.gain.setValueAtTime(0, randomTime);
                        gain.gain.linearRampToValueAtTime(0.3, randomTime + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, randomTime + 0.2);
                        osc.connect(gain);
                        gain.connect(masterGain);
                        osc.start(randomTime);
                        osc.stop(randomTime + 0.2);
                    }
                } else if (type === 'error') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.4, now + 0.05);
                    gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.connect(gain);
                    gain.connect(masterGain);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) { console.error("Audio Error:", e); }
        };

        function App() {
          const [gameState, setGameState] = useState('WELCOME'); 
          const [playerName, setPlayerName] = useState('');
          const [inputError, setInputError] = useState(false);
          const [gameStarted, setGameStarted] = useState(false); 
           
          const [currentLevelIndex, setCurrentLevelIndex] = useState(0);
          const [maxReachedLevel, setMaxReachedLevel] = useState(0); 
          const [foundWords, setFoundWords] = useState([]);
          const [guesses, setGuesses] = useState({});
          const [selectedNode, setSelectedNode] = useState(null);
          const [showWinModal, setShowWinModal] = useState(false);
          const [showLevelMap, setShowLevelMap] = useState(false); 
          const [showInGameMenu, setShowInGameMenu] = useState(false); 
           
          const [showResetConfirm, setShowResetConfirm] = useState(false);
          const [showQuitConfirm, setShowQuitConfirm] = useState(false);
          const [showLogoutConfirm, setShowLogoutConfirm] = useState(false); 

          const [errorMsg, setErrorMsg] = useState(null);
          const [starDust, setStarDust] = useState(10);
          const [animatingStar, setAnimatingStar] = useState(null);
          const [hintTargetIndex, setHintTargetIndex] = useState(null);
          const [backgroundStars, setBackgroundStars] = useState([]);
          const [backgroundShootingStars, setBackgroundShootingStars] = useState([]);
          const [soundEnabled, setSoundEnabled] = useState(true);

          const inputRef = useRef(null);
          const letterSlotRefs = useRef([]);
          const mapContainerRef = useRef(null);

          const currentLevel = LEVELS[currentLevelIndex] || LEVELS[0];
          const totalNodes = currentLevel.chain.length + 2;

          const play = (type) => { if (soundEnabled) playSound(type); };
          const isSessionActive = playerName && playerName.trim().length > 0;

          useEffect(() => {
            const savedName = localStorage.getItem('yildizAgiName');
            const savedLevel = localStorage.getItem('yildizAgiCurrentLevel');
            const savedMaxLevel = localStorage.getItem('yildizAgiMaxLevel');
            const savedDust = localStorage.getItem('yildizAgiDust');
            if (savedName) setPlayerName(savedName);
            if (savedLevel) setCurrentLevelIndex(parseInt(savedLevel));
            if (savedMaxLevel) setMaxReachedLevel(parseInt(savedMaxLevel));
            if (savedDust) setStarDust(parseInt(savedDust));
          }, []);

          useEffect(() => {
            if (playerName) localStorage.setItem('yildizAgiName', playerName);
            if (!playerName) {
                localStorage.removeItem('yildizAgiCurrentLevel');
                localStorage.removeItem('yildizAgiMaxLevel');
                localStorage.removeItem('yildizAgiDust');
            } else {
                localStorage.setItem('yildizAgiCurrentLevel', currentLevelIndex);
                localStorage.setItem('yildizAgiMaxLevel', maxReachedLevel);
                localStorage.setItem('yildizAgiDust', starDust);
            }
          }, [playerName, currentLevelIndex, maxReachedLevel, starDust]);

          useEffect(() => {
            const stars = Array.from({ length: 150 }).map((_, i) => ({
              id: i,
              left: Math.random() * 100,
              top: Math.random() * 100,
              size: Math.random() * 2 + 1,
              opacity: Math.random() * 0.5 + 0.1,
              blinkDuration: Math.random() * 3 + 2,
              blinkDelay: Math.random() * 5
            }));
            setBackgroundStars(stars);
            const interval = setInterval(() => {
                if(Math.random() > 0.6) { 
                    const newShootingStar = {
                        id: Date.now(),
                        left: Math.random() * 100,
                        top: Math.random() * 40, 
                        scale: Math.random() * 0.5 + 0.5,
                        duration: 2.5 
                    };
                    setBackgroundShootingStars(prev => [...prev, newShootingStar]);
                    setTimeout(() => {
                        setBackgroundShootingStars(prev => prev.filter(s => s.id !== newShootingStar.id));
                    }, 3000);
                }
            }, 6000); 
            return () => clearInterval(interval);
          }, []);

          useEffect(() => {
              if (showLevelMap && mapContainerRef.current) {
                  const currentEl = document.getElementById(`level-btn-${currentLevelIndex}`);
                  if (currentEl) {
                      currentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                  }
              }
          }, [showLevelMap, currentLevelIndex]);

          useEffect(() => {
            setFoundWords([]);
            setGuesses({});
            setSelectedNode(null);
            setShowWinModal(false);
            setErrorMsg(null);
            setAnimatingStar(null);
            setHintTargetIndex(null);
            setShowInGameMenu(false); 
          }, [currentLevelIndex]);

          useEffect(() => {
            if (selectedNode !== null && inputRef.current && window.innerWidth > 768) {
              inputRef.current.focus();
            }
            if (currentLevel && currentLevel.chain && currentLevel.chain[selectedNode]) {
                letterSlotRefs.current = letterSlotRefs.current.slice(0, currentLevel.chain[selectedNode].length);
            }
          }, [selectedNode, currentLevel]);

          const handleMainButton = () => {
              if (!playerName.trim()) {
                  setInputError(true);
                  play('error');
                  setTimeout(() => setInputError(false), 800); 
                  return;
              }
              play('click');
              setGameStarted(true); 
              setGameState('PLAYING');
          };

          const tryStartNewGame = () => {
              if (maxReachedLevel > 0) {
                  play('click');
                  setShowResetConfirm(true); 
              }
          };

          const confirmNewGame = () => {
              play('click');
              setCurrentLevelIndex(0);
              setStarDust(10);
              setMaxReachedLevel(0);
              setFoundWords([]); 
              setGuesses({});
              setGameState('WELCOME'); 
              setGameStarted(false); 
              setShowResetConfirm(false);
          };

          const goToLevel = (levelIndex) => {
              if (levelIndex <= maxReachedLevel) {
                  play('click');
                  setCurrentLevelIndex(levelIndex);
                  setGameState('PLAYING');
                  setShowLevelMap(false);
              }
          };

          const tryQuitGame = () => {
              play('click');
              setShowInGameMenu(false);
              setShowQuitConfirm(true);
          };

          const confirmQuit = () => {
              play('click');
              setGameState('WELCOME');
              setShowQuitConfirm(false);
          };

          const tryLogoutUser = () => {
              play('click');
              setShowLogoutConfirm(true);
          };

          const confirmLogout = () => {
              play('click');
              setPlayerName('');
              setCurrentLevelIndex(0); 
              setMaxReachedLevel(0); 
              setStarDust(10);
              localStorage.removeItem('yildizAgiName');
              setGameState('WELCOME');
              setGameStarted(false); 
              setShowLogoutConfirm(false);
          };

          const handleNodeClick = (index) => {
            play('click');
            if (index === 0 || index === totalNodes - 1 || foundWords.includes(index - 1)) return;
            const prevIndex = index - 1;
            if (prevIndex > 0 && !foundWords.includes(prevIndex - 1)) {
              play('error');
              setErrorMsg("Bağlantı henüz kilitli.");
              setTimeout(() => setErrorMsg(null), 2000);
              return;
            }
            setSelectedNode(index - 1);
            setErrorMsg(null);
          };

          const processInput = (val) => {
            if (selectedNode === null) return;
            const targetWord = currentLevel.chain[selectedNode];
            const userGuess = val.toLocaleUpperCase('tr-TR');
             
            if (userGuess.length <= targetWord.length) {
               setGuesses({...guesses, [selectedNode]: userGuess});
            }
            if (userGuess === targetWord) {
              handleCorrectGuess(selectedNode);
            }
          };

          const handleVirtualKeyPress = (char) => {
              play('click');
              const currentVal = guesses[selectedNode] || "";
              const targetWord = currentLevel.chain[selectedNode];
              if (currentVal.length < targetWord.length) {
                  processInput(currentVal + char);
              }
          };

          const handleVirtualBackspace = () => {
              play('click');
              const currentVal = guesses[selectedNode] || "";
              if (currentVal.length > 0) {
                  processInput(currentVal.slice(0, -1));
              }
          };

          const handleCorrectGuess = (nodeIndex) => {
            play('wordFound'); 
            const newFound = [...foundWords, nodeIndex];
            setFoundWords(newFound);
            setTimeout(() => {
              setSelectedNode(null);
              if (newFound.length === currentLevel.chain.length) {
                setTimeout(() => {
                    play('levelComplete'); 
                    setShowWinModal(true);
                }, 500);
              }
            }, 400);
          };

          const handleGetLetter = () => {
            if (selectedNode === null || animatingStar) return;
            if (starDust < 1) {
                play('error');
                setErrorMsg("Yıldız tozu yetersiz.");
                setTimeout(() => setErrorMsg(null), 2000);
                return;
            }
            play('hint');
            const targetWord = currentLevel.chain[selectedNode];
            const currentVal = (guesses[selectedNode] || "").toLocaleUpperCase('tr-TR');
            let nextIndex = 0;
            for(let i=0; i<targetWord.length; i++) {
                if (currentVal[i] !== targetWord[i]) {
                    nextIndex = i;
                    break;
                }
                nextIndex = i + 1;
            }
            if (nextIndex < targetWord.length) {
                setStarDust(prev => prev - 1);
                const targetSlot = letterSlotRefs.current[nextIndex];
                if(!targetSlot) return;
                const rect = targetSlot.getBoundingClientRect();
                const startX = window.innerWidth * 0.8; 
                const startY = -50; 
                const targetX = rect.left + rect.width / 2;
                const targetY = rect.top + rect.height / 2;
                const deltaX = targetX - startX;
                const deltaY = targetY - startY;
                const angle = Math.atan2(deltaY, deltaX) * (180 / Math.PI);
                setAnimatingStar({ startX, startY, targetX, targetY, angle });
                setTimeout(() => {
                    const nextChar = targetWord[nextIndex];
                    const newVal = currentVal.substring(0, nextIndex) + nextChar + currentVal.substring(nextIndex + 1);
                    setGuesses({ ...guesses, [selectedNode]: newVal });
                    setHintTargetIndex(nextIndex);
                    setTimeout(() => setHintTargetIndex(null), 800);
                    if (newVal === targetWord) { handleCorrectGuess(selectedNode); }
                    setAnimatingStar(null);
                    if(window.innerWidth > 768) inputRef.current?.focus();
                }, 2000);
            }
          };

          const handleRevealWord = () => {
              if (starDust < 3) {
                  play('error');
                  setErrorMsg("Yıldız tozu yetersiz (3 gerekli).");
                  setTimeout(() => setErrorMsg(null), 2000);
                  return;
              }
              play('hint');
              setStarDust(prev => prev - 3);
              const targetWord = currentLevel.chain[selectedNode];
              setGuesses({ ...guesses, [selectedNode]: targetWord });
              handleCorrectGuess(selectedNode);
          };

          const nextLevel = () => {
            play('click');
            setStarDust(prev => prev + 2); 
            const nextIndex = currentLevelIndex + 1;
            if (nextIndex > maxReachedLevel) {
                setMaxReachedLevel(nextIndex);
            }
            if (nextIndex < LEVELS.length) {
              setCurrentLevelIndex(nextIndex);
            } else {
              alert("Yolculuk tamamlandı. Evren artık bağlı.");
              setCurrentLevelIndex(0);
            }
          };

          const getPositions = (total) => {
              const positions = [];
              positions.push({ x: 10, y: 50 }); 
              const chainLen = total - 2;
              const stepX = 80 / (chainLen + 1);
              for(let i=1; i<=chainLen; i++) {
                  positions.push({ x: 10 + (i * stepX), y: i % 2 === 0 ? 35 : 65 });
              }
              positions.push({ x: 90, y: 50 });
              return positions;
          };

          const nodePositions = getPositions(totalNodes);
           
          const showContinue = (gameStarted || maxReachedLevel > 0) && isSessionActive;
          const mainButtonText = showContinue ? "DEVAM ET" : "BAŞLAT";
          const MainButtonIcon = showContinue ? ArrowRight : Play;

          return (
            <div className="fixed inset-0 w-full h-full font-sans overflow-hidden selection:bg-white/20 relative text-white bg-black">
              {/* ARKA PLAN */}
              <div className="absolute inset-0 z-0 bg-black pointer-events-none">
                  <div className="absolute top-0 left-0 w-full h-full bg-[radial-gradient(circle_at_50%_50%,_#1a1a2e_0%,_#000000_90%)] opacity-80" />
              </div>
              <div className="absolute inset-0 z-0 opacity-[0.1] pointer-events-none mix-blend-overlay" style={{backgroundImage: "url('https://grainy-gradients.vercel.app/noise.svg')"}}></div>
              
              <div className="absolute inset-[-50%] z-0 animate-[spin_240s_linear_infinite] pointer-events-none opacity-80">
                  {backgroundStars.map((star) => (
                      <div 
                          key={star.id} 
                          className="absolute rounded-full bg-white" 
                          style={{ 
                              left: `${star.left}%`, 
                              top: `${star.top}%`, 
                              width: `${star.size}px`, 
                              height: `${star.size}px`, 
                              opacity: star.opacity, 
                              boxShadow: `0 0 ${star.size * 2}px rgba(255,255,255,0.8)`,
                              animation: `twinkle ${star.blinkDuration}s infinite ease-in-out ${star.blinkDelay}s`
                          }} 
                      />
                  ))}
              </div>

              <div className="absolute inset-0 z-0 pointer-events-none">
                  {backgroundShootingStars.map(star => (
                      <div 
                        key={star.id} 
                        className="absolute" 
                        style={{ 
                            left: `${star.left}%`, 
                            top: `${star.top}%`, 
                            transform: `scale(${star.scale}) rotate(-45deg)`, 
                            animation: `smoothShootingStar ${star.duration}s ease-out forwards` 
                        }}
                      >
                          <div className="w-1.5 h-1.5 bg-white rounded-full shadow-[0_0_15px_4px_rgba(255,255,255,1)] relative z-10" />
                          <div className="absolute top-1/2 left-0 w-[500px] h-[2px] bg-gradient-to-l from-transparent via-blue-100/40 to-white -translate-y-1/2 origin-left blur-[1px]" />
                      </div>
                  ))}
              </div>

              {/* --- ATLAS --- */}
              {showLevelMap && (
                  <div className="absolute inset-0 z-[60] flex items-center justify-center p-6 bg-black/80 backdrop-blur-md animate-in fade-in duration-300">
                      <div className="w-full max-w-5xl bg-[#0B0B15]/95 border border-white/10 rounded-[2rem] p-6 md:p-10 shadow-2xl h-[90vh] flex flex-col relative overflow-hidden">
                          <div className="flex justify-between items-center mb-6 relative z-10">
                              <div className="flex items-center gap-3">
                                  <Map className="text-amber-200" size={24} />
                                  <h2 className="text-xl md:text-2xl font-light tracking-[0.2em] text-white">ATLAS</h2>
                              </div>
                              <button onClick={() => {play('click'); setShowLevelMap(false)}} className="flex items-center gap-2 px-4 py-2 rounded-full bg-white/10 hover:bg-white/20 text-white transition-colors text-xs font-bold tracking-widest">
                                  <ArrowLeft size={16} /> GERİ DÖN
                              </button>
                          </div>
                          <div ref={mapContainerRef} className="flex-1 overflow-y-auto pr-2 grid grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-4 content-start custom-scrollbar relative z-10">
                              {Array.from({ length: 100 }).map((_, i) => {
                                  const isLocked = i > maxReachedLevel;
                                  const isCurrent = i === currentLevelIndex;
                                  const isPassed = i < maxReachedLevel;
                                  return (
                                      <button key={i} id={`level-btn-${i}`} onClick={() => goToLevel(i)} disabled={isLocked} className={`aspect-square rounded-full flex flex-col items-center justify-center relative group transition-all duration-500 ${isCurrent ? 'scale-110 z-10' : isPassed ? 'scale-100 hover:scale-105 opacity-100' : 'scale-90 opacity-40 grayscale'}`}>
                                          <div className={`absolute inset-0 rounded-full shadow-inner border ${isCurrent ? 'bg-gradient-to-br from-indigo-500 to-purple-600 border-indigo-300/50 shadow-[0_0_30px_rgba(99,102,241,0.6)] animate-pulse-slow' : isPassed ? 'bg-gradient-to-br from-amber-600/80 to-orange-800/80 border-amber-500/30' : 'bg-[#1a1a2e] border-white/5'}`} />
                                          <span className={`relative z-10 text-sm md:text-lg font-bold tracking-widest ${isCurrent ? 'text-white' : isPassed ? 'text-amber-100' : 'text-gray-500'}`}>{i + 1}</span>
                                          {isPassed && !isCurrent && <Star size={10} className="absolute -top-1 -right-1 text-amber-300 drop-shadow-md fill-amber-300" />}
                                          {isLocked && <Lock size={12} className="absolute bottom-2 opacity-50" />}
                                      </button>
                                  )
                              })}
                          </div>
                      </div>
                  </div>
              )}

              {/* --- EKRANLAR --- */}
              {gameState === 'WELCOME' ? (
                  <div className="relative z-20 flex flex-col items-center justify-center w-full h-full p-6 animate-in fade-in duration-1000">
                      <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                          <div className="w-[80vw] h-[80vw] max-w-[600px] max-h-[600px] rounded-full bg-gradient-to-tr from-indigo-900/20 via-purple-900/10 to-transparent blur-[100px] animate-pulse-slow" />
                      </div>
                      <div className="relative z-10 flex flex-col items-center gap-8 max-w-sm w-full">
                          <div className="flex flex-col items-center gap-2 transform hover:scale-105 transition-transform duration-700">
                              <div className="p-4 rounded-full bg-white/5 border border-white/10 shadow-[0_0_40px_rgba(255,255,255,0.1)] backdrop-blur-xl mb-4">
                                  <BrainCircuit size={48} className="text-indigo-200 opacity-90" />
                              </div>
                              <h1 className="text-4xl md:text-6xl font-extralight tracking-[0.3em] text-white text-center">
                                  YILDIZ<br/><span className="font-bold text-transparent bg-clip-text bg-gradient-to-b from-white to-white/40">AĞI</span>
                              </h1>
                          </div>
                          <div className="w-full space-y-4 backdrop-blur-md bg-white/5 p-8 rounded-[2.5rem] border border-white/10 shadow-2xl relative overflow-hidden group">
                              <div className="absolute -top-20 -right-20 w-40 h-40 bg-purple-500/10 rounded-full blur-3xl group-hover:bg-purple-500/20 transition-all duration-1000" />
                              <button onClick={() => setSoundEnabled(!soundEnabled)} className="absolute top-5 right-6 text-white/30 hover:text-white transition-colors">
                                  {soundEnabled ? <Volume2 size={18} /> : <VolumeX size={18} />}
                              </button>
                              <div className="space-y-2 mb-6 pt-4">
                                  <label className="text-[10px] uppercase tracking-[0.2em] text-gray-400 pl-3">Kozmik Kimlik</label>
                                  <div className={`relative group/input transition-all duration-300 ${inputError ? 'animate-shake' : ''}`}>
                                      <User className={`absolute left-4 top-1/2 -translate-y-1/2 transition-colors size={18} ${inputError ? 'text-red-400' : 'text-gray-500 group-focus-within/input:text-white'}`} />
                                      <input 
                                          type="text" 
                                          value={playerName} 
                                          onChange={(e) => { setPlayerName(e.target.value); setInputError(false); }} 
                                          placeholder="İsim Giriniz..." 
                                          className={`w-full bg-black/40 border rounded-2xl py-3.5 pl-11 pr-4 text-white font-light focus:outline-none transition-all tracking-wide
                                          ${inputError ? 'border-red-500/50 bg-red-500/10 placeholder:text-red-300/50' : 'border-white/10 focus:border-indigo-400/50 focus:bg-black/60 placeholder:text-gray-600'}
                                          `}
                                      />
                                  </div>
                              </div>
                              <div className="space-y-3">
                                  <button 
                                      onClick={handleMainButton}
                                      className="w-full group relative overflow-hidden rounded-2xl bg-white text-black py-4 font-bold tracking-[0.25em] transition-all hover:scale-[1.02] shadow-[0_0_30px_rgba(255,255,255,0.2)] active:scale-95"
                                  >
                                      <div className="absolute inset-0 bg-gradient-to-r from-transparent via-white/80 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000" />
                                      <span className="relative z-10 flex items-center justify-center gap-2 text-sm">
                                          {mainButtonText} {MainButtonIcon === ArrowRight ? <ArrowRight size={16} /> : <Play size={14} fill="black" />}
                                      </span>
                                  </button>
                                  <div className="flex gap-2">
                                      <button onClick={() => { play('click'); setShowLevelMap(true)}} className="flex-1 rounded-2xl bg-white/5 hover:bg-white/10 text-white py-3 font-bold tracking-[0.2em] transition-all border border-white/5 hover:border-white/20 text-[10px]">
                                          <span className="relative z-10 flex items-center justify-center gap-2">
                                              ATLAS <Grid size={14} />
                                          </span>
                                      </button>
                                      
                                      {maxReachedLevel > 0 && (
                                          <button onClick={tryStartNewGame} className="flex-1 rounded-2xl bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white py-3 font-bold tracking-[0.2em] transition-all border border-white/5 hover:border-white/20 text-[10px]">
                                              <span className="relative z-10 flex items-center justify-center gap-2">
                                                  SIFIRLA <RefreshCcw size={14} />
                                              </span>
                                          </button>
                                      )}
                                  </div>
                                  {isSessionActive && (
                                      <button onClick={tryLogoutUser} className="w-full rounded-2xl bg-transparent hover:bg-red-500/10 text-gray-500 hover:text-red-300 py-2 font-medium tracking-[0.1em] transition-all text-[10px]">
                                          OTURUMU KAPAT
                                      </button>
                                  )}
                              </div>
                              {currentLevelIndex > 0 && (
                                <div className="text-center pt-2 border-t border-white/5 mt-2">
                                    <span className="text-[10px] text-indigo-300/60 uppercase tracking-[0.1em] font-medium">
                                        SON KONUM: SEVİYE {currentLevelIndex + 1}
                                    </span>
                                </div>
                              )}
                          </div>
                      </div>
                  </div>
              ) : (
                  // OYUN EKRANI
                  <>
                    <div className="fixed top-0 left-0 right-0 z-50 p-4 md:p-6 flex justify-between items-start pointer-events-none">
                        <div className="flex flex-col gap-1 pointer-events-auto">
                            <h2 className="text-xl md:text-2xl font-light tracking-[0.2em] text-white drop-shadow-lg">{playerName.toUpperCase()}</h2>
                            <div className="flex items-center gap-2 text-white/60 text-xs tracking-widest bg-black/20 px-3 py-1 rounded-full backdrop-blur-sm border border-white/5 w-fit">
                                <span>SEVİYE {String(currentLevelIndex + 1).padStart(2, '0')}</span>
                                <div className="w-8 h-[1px] bg-white/20" />
                                <span>100</span>
                            </div>
                        </div>
                        <div className="flex flex-col items-end gap-3 pointer-events-auto relative">
                            <div className="flex items-center gap-3 px-4 py-2 bg-white/5 backdrop-blur-xl rounded-full border border-white/10 shadow-lg mb-2">
                                <Sparkles className="w-4 h-4 text-amber-200" />
                                <span className="text-amber-100 font-bold text-xs tracking-wider">{starDust} TOZ</span>
                            </div>
                            <button onClick={() => {play('click'); setShowInGameMenu(!showInGameMenu)}} className="flex items-center gap-2 px-5 py-2 bg-white text-black rounded-full font-bold tracking-widest text-xs hover:scale-105 transition-transform shadow-[0_0_20px_rgba(255,255,255,0.2)]">
                                MENÜ
                            </button>
                            {showInGameMenu && (
                                <div className="absolute top-full right-0 mt-2 w-48 bg-[#0B0B15]/95 backdrop-blur-2xl border border-white/10 rounded-2xl shadow-2xl p-2 flex flex-col gap-1 animate-in slide-in-from-top-2 duration-300 origin-top-right z-50">
                                    <button onClick={tryQuitGame} className="flex items-center gap-3 w-full p-3 rounded-xl hover:bg-white/10 text-white/90 hover:text-white transition-colors text-left group">
                                        <div className="p-1.5 rounded-full bg-white/5 group-hover:bg-white/20 transition-colors"><Home size={14} /></div>
                                        <span className="text-[10px] font-bold tracking-wider">ANA MENÜ</span>
                                    </button>
                                    <button onClick={() => { play('click'); setShowLevelMap(true); setShowInGameMenu(false); }} className="flex items-center gap-3 w-full p-3 rounded-xl hover:bg-white/10 text-white/90 hover:text-white transition-colors text-left group">
                                        <div className="p-1.5 rounded-full bg-white/5 group-hover:bg-white/20 transition-colors"><Map size={14} /></div>
                                        <span className="text-[10px] font-bold tracking-wider">ATLAS</span>
                                    </button>
                                    <button onClick={() => { play('click'); setSoundEnabled(!soundEnabled); }} className="flex items-center gap-3 w-full p-3 rounded-xl hover:bg-white/10 text-white/90 hover:text-white transition-colors text-left group">
                                        <div className="p-1.5 rounded-full bg-white/5 group-hover:bg-white/20 transition-colors">{soundEnabled ? <Volume2 size={14} /> : <VolumeX size={14} />}</div>
                                        <span className="text-[10px] font-bold tracking-wider">SES: {soundEnabled ? 'AÇIK' : 'KAPALI'}</span>
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>

                    <main className="relative z-10 w-full h-screen flex justify-center items-center overflow-hidden">
                        <svg className="absolute inset-0 w-full h-full pointer-events-none z-0">
                        {nodePositions.map((pos, i) => {
                            if (i === nodePositions.length - 1) return null;
                            const nextPos = nodePositions[i + 1];
                            const isSourceActive = i === 0 || foundWords.includes(i - 1);
                            const isTargetActive = (i + 1) === (totalNodes - 1) || foundWords.includes(i);
                            const isLineActive = isSourceActive && isTargetActive;
                            const isLineVisible = isSourceActive;
                            return (
                            <g key={`line-${i}`}>
                                <line x1={`${pos.x}%`} y1={`${pos.y}%`} x2={`${nextPos.x}%`} y2={`${nextPos.y}%`} stroke="rgba(255,255,255,0.03)" strokeWidth="0.5" />
                                <line x1={`${pos.x}%`} y1={`${pos.y}%`} x2={`${nextPos.x}%`} y2={`${nextPos.y}%`} stroke={isLineActive ? "url(#gradient-line)" : "rgba(255, 255, 255, 0.1)"} strokeWidth={isLineActive ? "1.5" : "0.5"} className={`transition-all duration-1000 ease-in-out ${isLineVisible ? 'opacity-100' : 'opacity-0'}`} />
                            </g>
                            );
                        })}
                        <defs>
                            <linearGradient id="gradient-line" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stopColor="#818cf8" />
                                <stop offset="100%" stopColor="#fff" />
                            </linearGradient>
                        </defs>
                        </svg>

                        {nodePositions.map((pos, index) => {
                        const isStart = index === 0;
                        const isEnd = index === totalNodes - 1;
                        const chainIndex = index - 1;
                        const isFound = !isStart && !isEnd && foundWords.includes(chainIndex);
                        const isNextToSolve = !isStart && !isEnd && !isFound && (chainIndex === 0 || foundWords.includes(chainIndex - 1));
                        const isLocked = !isStart && !isEnd && !isFound && !isNextToSolve;
                        let label = isStart ? currentLevel.startWord : isEnd ? currentLevel.endWord : isFound ? currentLevel.chain[chainIndex] : "?";

                        return (
                            <div key={`node-${index}`} className={`absolute transform -translate-x-1/2 -translate-y-1/2 transition-all duration-700 flex flex-col items-center gap-4 group ${isNextToSolve ? 'cursor-pointer z-20 scale-110' : 'z-10 scale-100'} ${isLocked ? 'opacity-30 grayscale blur-[1px]' : 'opacity-100'}`} style={{ left: `${pos.x}%`, top: `${pos.y}%` }} onClick={() => handleNodeClick(index)}>
                            <div className={`relative w-14 h-14 rounded-full flex items-center justify-center border backdrop-blur-md transition-all duration-500 ${(isStart || isEnd || isFound) ? 'bg-amber-500/10 border-amber-300/40 shadow-[0_0_50px_rgba(251,191,36,0.3)]' : isNextToSolve ? 'bg-indigo-500/10 border-indigo-200/40 shadow-[0_0_40px_rgba(129,140,248,0.2)]' : 'bg-white/5 border-white/5'}`}>
                                {isFound || isStart || isEnd ? <Star fill="#fbbf24" size={20} className="text-amber-300 animate-[spin_10s_linear_infinite]" /> : <div className={`w-2 h-2 rounded-full ${isNextToSolve ? 'bg-indigo-300 animate-pulse' : 'bg-white/20'}`} />}
                                {(isNextToSolve || isFound) && <div className="absolute inset-[-4px] rounded-full border border-white/5 animate-[spin_8s_linear_infinite]" />}
                            </div>
                            <span className={`text-[10px] font-bold tracking-[0.2em] px-4 py-2 rounded-full backdrop-blur-md border transition-all duration-500 whitespace-nowrap ${(isStart || isEnd || isFound) ? 'bg-amber-950/30 border-amber-500/20 text-amber-100 shadow-lg' : isNextToSolve ? 'bg-indigo-950/30 border-indigo-500/20 text-indigo-100 shadow-lg' : 'bg-transparent border-transparent text-gray-500'}`}>{label}</span>
                            </div>
                        );
                        })}
                    </main>

                    <div className={`fixed inset-0 z-40 flex items-end md:items-center justify-center pointer-events-none transition-all duration-500 ${selectedNode !== null ? 'opacity-100' : 'opacity-0'}`}>
                        {selectedNode !== null && (
                        <div className="pointer-events-auto w-full md:w-auto md:max-w-2xl bg-[#050505]/95 backdrop-blur-3xl border-t md:border border-white/10 rounded-t-[2.5rem] md:rounded-[2.5rem] p-6 md:p-8 shadow-[0_-10px_40px_rgba(0,0,0,0.8)] flex flex-col items-center gap-6 max-h-[90vh] overflow-y-auto">
                            
                            <button onClick={() => {play('click'); setSelectedNode(null)}} className="absolute top-6 right-6 text-white/20 hover:text-white transition-colors p-2"><X size={24} /></button>
                            
                            <div className="text-center space-y-2 mt-4 md:mt-0">
                                <span className="text-[10px] tracking-[0.4em] text-gray-500 uppercase">BAĞLANTIYI KUR</span>
                                <p className="font-light text-lg md:text-xl text-white px-4">{currentLevel.hints[selectedNode]}</p>
                            </div>

                            <div className="relative w-full flex justify-center py-2">
                                <input ref={inputRef} type="text" value={guesses[selectedNode] || ''} onChange={(e) => processInput(e.target.value)} className="absolute inset-0 w-full h-full opacity-0 cursor-default md:cursor-text" autoComplete="off" inputMode="none" />
                                
                                <div className="flex gap-2 md:gap-3 justify-center">
                                    {Array.from({ length: currentLevel.chain[selectedNode].length }).map((_, charIndex) => {
                                    const letter = (guesses[selectedNode] || "")[charIndex];
                                    const isHintTarget = hintTargetIndex === charIndex;
                                    return (
                                        <div 
                                            key={charIndex} 
                                            ref={el => letterSlotRefs.current[charIndex] = el} 
                                            className={`
                                                w-10 h-14 md:w-12 md:h-16 border-b-2 flex items-center justify-center text-2xl md:text-3xl font-thin transition-all duration-500 
                                                ${isHintTarget 
                                                    ? 'border-white text-white shadow-[0_0_30px_white]' 
                                                    : letter 
                                                        ? 'border-white/80 text-white' 
                                                        : 'border-white/30 text-white/10'
                                                }
                                            `}
                                        >
                                            {letter}
                                        </div>
                                    );
                                    })}
                                </div>
                            </div>

                            <div className="flex gap-3 w-full justify-center">
                                    <button onClick={handleGetLetter} disabled={!!animatingStar || starDust < 1} className="flex-1 max-w-[140px] group relative flex items-center justify-center gap-2 px-4 py-3 rounded-2xl bg-gradient-to-r from-amber-500/10 to-orange-500/10 border border-amber-500/20 text-amber-200 hover:text-white hover:border-amber-400 hover:bg-amber-500/20 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                                        <Lightbulb size={16} className={`${animatingStar ? 'animate-pulse' : ''}`} />
                                        <span className="text-[10px] font-bold tracking-widest">HARF (1)</span>
                                    </button>
                                    <button onClick={handleRevealWord} disabled={starDust < 3} className="flex-1 max-w-[140px] group relative flex items-center justify-center gap-2 px-4 py-3 rounded-2xl bg-gradient-to-r from-pink-500/10 to-rose-500/10 border border-pink-500/20 text-pink-200 hover:text-white hover:border-pink-400 hover:bg-pink-500/20 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                                        {starDust < 3 ? <Lock size={16} /> : <Eye size={16} />}
                                        <span className="text-[10px] font-bold tracking-widest">ÇÖZ (3)</span>
                                    </button>
                            </div>

                            {/* --- QWERTY SANAL KLAVYE --- */}
                            <div className="w-full max-w-lg mt-2 pb-4 flex flex-col gap-2">
                                {KEYBOARD_ROWS.map((row, rowIndex) => (
                                    <div key={rowIndex} className="flex justify-center gap-1.5 md:gap-2">
                                        {row.map((char) => (
                                            <button
                                                key={char}
                                                onClick={() => handleVirtualKeyPress(char)}
                                                className="w-8 h-10 md:w-10 md:h-12 rounded-lg backdrop-blur-md bg-gradient-to-b from-indigo-900/40 to-black/60 border border-indigo-500/30 text-white font-medium text-sm md:text-base transition-all flex items-center justify-center shadow-[0_0_15px_rgba(99,102,241,0.15)] hover:border-indigo-400 hover:shadow-[0_0_25px_rgba(99,102,241,0.4)] hover:scale-105 active:scale-95"
                                            >
                                                {char}
                                            </button>
                                        ))}
                                        {rowIndex === 2 && (
                                            <button
                                                onClick={handleVirtualBackspace}
                                                className="w-10 h-10 md:w-12 md:h-12 rounded-lg bg-red-900/30 hover:bg-red-800/50 border border-red-500/30 text-red-200 flex items-center justify-center transition-all shadow-[0_0_15px_rgba(239,68,68,0.15)] hover:shadow-[0_0_25px_rgba(239,68,68,0.3)]"
                                            >
                                                <Delete size={18} />
                                            </button>
                                        )}
                                    </div>
                                ))}
                            </div>

                        </div>
                        )}
                    </div>

                    {animatingStar && (
                        <div className="fixed z-[100] pointer-events-none" style={{ left: animatingStar.startX, top: animatingStar.startY, transform: `rotate(${animatingStar.angle}deg)`, transformOrigin: 'left center', animation: 'cinematicHintStar 2s cubic-bezier(0.2, 0, 0.2, 1) forwards', '--delta-x': `${animatingStar.targetX - animatingStar.startX}px`, '--delta-y': `${animatingStar.targetY - animatingStar.startY}px` }}>
                            <div className="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow-[0_0_40px_10px_rgba(255,255,255,0.8)]" />
                            <div className="absolute right-2 top-1/2 -translate-y-1/2 w-[400px] h-[2px] bg-gradient-to-r from-transparent via-indigo-300 to-white blur-[1px] opacity-80" />
                        </div>
                    )}
                  </>
              )}

              {/* --- MODALLAR --- */}
              {showResetConfirm && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md animate-in fade-in duration-300">
                      <div className="bg-[#0B0B15] p-8 rounded-3xl border border-white/10 shadow-2xl max-w-sm w-full mx-6">
                          <div className="flex flex-col items-center text-center gap-6">
                              <AlertTriangle className="text-amber-400 w-12 h-12" />
                              <div className="space-y-2">
                                  <h3 className="text-xl text-white font-light tracking-widest">SIFIRLA?</h3>
                                  <p className="text-gray-400 text-sm">Tüm ilerlemen ve yıldız tozların silinecek.</p>
                              </div>
                              <div className="flex gap-3 w-full">
                                  <button onClick={() => setShowResetConfirm(false)} className="flex-1 py-3 rounded-xl border border-white/10 text-gray-300 hover:bg-white/5 transition-colors text-xs font-bold tracking-widest">İPTAL</button>
                                  <button onClick={confirmNewGame} className="flex-1 py-3 rounded-xl bg-amber-600 hover:bg-amber-500 text-white transition-colors text-xs font-bold tracking-widest">SIFIRLA</button>
                              </div>
                          </div>
                      </div>
                  </div>
              )}

              {showQuitConfirm && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md animate-in fade-in duration-300">
                      <div className="bg-[#0B0B15] p-8 rounded-3xl border border-white/10 shadow-2xl max-w-sm w-full mx-6">
                          <div className="flex flex-col items-center text-center gap-6">
                              <LogOut className="text-white/80 w-12 h-12" />
                              <div className="space-y-2">
                                  <h3 className="text-xl text-white font-light tracking-widest">ÇIKIŞ?</h3>
                                  <p className="text-gray-400 text-sm">İlerlemen kaydedildi. Ana menüye dönmek istiyor musun?</p>
                              </div>
                              <div className="flex gap-3 w-full">
                                  <button onClick={() => setShowQuitConfirm(false)} className="flex-1 py-3 rounded-xl border border-white/10 text-gray-300 hover:bg-white/5 transition-colors text-xs font-bold tracking-widest">İPTAL</button>
                                  <button onClick={confirmQuit} className="flex-1 py-3 rounded-xl bg-white text-black hover:bg-gray-200 transition-colors text-xs font-bold tracking-widest">ÇIK</button>
                              </div>
                          </div>
                      </div>
                  </div>
              )}

              {showLogoutConfirm && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md animate-in fade-in duration-300">
                      <div className="bg-[#0B0B15] p-8 rounded-3xl border border-white/10 shadow-2xl max-w-sm w-full mx-6">
                          <div className="flex flex-col items-center text-center gap-6">
                              <LogOut className="text-red-400 w-12 h-12" />
                              <div className="space-y-2">
                                  <h3 className="text-xl text-white font-light tracking-widest">OTURUMU KAPAT?</h3>
                                  <p className="text-gray-400 text-sm">Giriş ekranına dönülecek.</p>
                              </div>
                              <div className="flex gap-3 w-full">
                                  <button onClick={() => setShowLogoutConfirm(false)} className="flex-1 py-3 rounded-xl border border-white/10 text-gray-300 hover:bg-white/5 transition-colors text-xs font-bold tracking-widest">İPTAL</button>
                                  <button onClick={confirmLogout} className="flex-1 py-3 rounded-xl bg-red-600 hover:bg-red-500 text-white transition-colors text-xs font-bold tracking-widest">KAPAT</button>
                              </div>
                          </div>
                      </div>
                  </div>
              )}

              {showWinModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-xl animate-in zoom-in-95 duration-500">
                  <div className="flex flex-col items-center gap-6 p-10 text-center">
                    <Star className="w-12 h-12 text-white animate-spin-slow shadow-[0_0_50px_white]" />
                    <h2 className="text-4xl font-extralight tracking-[0.4em] text-white">BAĞLANTI KURULDU</h2>
                    <div className="flex items-center gap-2 text-amber-300 font-bold tracking-widest bg-amber-900/20 px-4 py-2 rounded-full border border-amber-500/20 animate-pulse">
                        <Sparkles size={16} />
                        <span>+2 YILDIZ TOZU KAZANDIN</span>
                    </div>
                    <div className="w-px h-16 bg-gradient-to-b from-white to-transparent" />
                    <button onClick={nextLevel} className="px-12 py-4 bg-white text-black font-bold tracking-[0.2em] rounded-full hover:scale-105 transition-transform">DEVAM ET</button>
                  </div>
                </div>
              )}

              <style>{`
                 @keyframes twinkle { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.8; } }
                 @keyframes smoothShootingStar { 0% { opacity: 0; transform: translateX(0) translateY(0) scale(0.8) rotate(-45deg); } 10% { opacity: 1; } 100% { opacity: 0; transform: translateX(-800px) translateY(800px) scale(0.4) rotate(-45deg); } }
                 @keyframes cinematicHintStar { 0% { opacity: 0; transform: translate(0, 0) rotate(var(--angle)) scale(0.5); } 10% { opacity: 1; transform: translate(calc(var(--delta-x) * 0.1), calc(var(--delta-y) * 0.1)) rotate(var(--angle)) scale(1); } 100% { opacity: 0; transform: translate(var(--delta-x), var(--delta-y)) rotate(var(--angle)) scale(0.2); } }
                 @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
                 .animate-shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
                 .custom-scrollbar::-webkit-scrollbar { width: 8px; }
                 .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 4px; }
                 .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
                 .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
                 .animate-pulse-slow { animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
              `}</style>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
